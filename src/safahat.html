<style>
/* Layout: desktop-app shell — dark chrome (brand, document, actions, mode tabs), a light ribbon of grouped tools,
   a property strip, then the workspace: thumbnail rail + dotted desk holding the pages, and a slim status bar. RTL. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --raise:#f7f9f8; --ink:#132024; --muted:#5b6b6e; --line:#dfe6e4; --line-strong:#c8d2d0;
  --accent:#0f8a74; --accent-strong:#0b6e5f; --accent-ink:#ffffff; --accent-soft:#e1f3ee;
  --chrome:#0f1b1e; --chrome-2:#16262a; --chrome-ink:#eaf2f0; --chrome-muted:#8ea3a2; --chrome-line:#24363b;
  --desk:#e6ebe9; --dot:rgba(15,27,30,.075); --mark:#ffd84d; --danger:#c0362c; --danger-soft:#fdeceb;
  --blue:#2459d6; --blue-soft:#e7eefd; --amber:#a95a06; --amber-soft:#fcf0de; --violet:#6a46d6; --violet-soft:#eee9fc;
  --shadow-sm:0 1px 2px rgba(12,28,30,.08);
  --shadow:0 1px 2px rgba(12,28,30,.10),0 10px 28px -8px rgba(12,28,30,.22);
  --shadow-lg:0 24px 60px -18px rgba(8,20,22,.45);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1315; --surface:#141e21; --raise:#10181b; --ink:#e4edeb; --muted:#93a6a8; --line:#223135; --line-strong:#2f4348;
  --accent:#34c4a7; --accent-strong:#34c4a7; --accent-ink:#04201a; --accent-soft:#12322c;
  --chrome:#081012; --chrome-2:#0f1a1d; --chrome-ink:#e4edeb; --chrome-muted:#7d9395; --chrome-line:#1a2a2e;
  --desk:#090f11; --dot:rgba(255,255,255,.05); --mark:#ffd84d; --danger:#f2766b; --danger-soft:#3a1714;
  --blue:#82a6ff; --blue-soft:#17223b; --amber:#efb35b; --amber-soft:#30240f; --violet:#b39dff; --violet-soft:#221b3b;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5); --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 30px -8px rgba(0,0,0,.6); --shadow-lg:0 24px 60px -18px rgba(0,0,0,.8);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1315; --surface:#141e21; --raise:#10181b; --ink:#e4edeb; --muted:#93a6a8; --line:#223135; --line-strong:#2f4348;
  --accent:#34c4a7; --accent-strong:#34c4a7; --accent-ink:#04201a; --accent-soft:#12322c;
  --chrome:#081012; --chrome-2:#0f1a1d; --chrome-ink:#e4edeb; --chrome-muted:#7d9395; --chrome-line:#1a2a2e;
  --desk:#090f11; --dot:rgba(255,255,255,.05); --mark:#ffd84d; --danger:#f2766b; --danger-soft:#3a1714;
  --blue:#82a6ff; --blue-soft:#17223b; --amber:#efb35b; --amber-soft:#30240f; --violet:#b39dff; --violet-soft:#221b3b;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5); --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 30px -8px rgba(0,0,0,.6); --shadow-lg:0 24px 60px -18px rgba(0,0,0,.8);
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--chrome)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{height:100%;display:flex;flex-direction:column}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---- chrome ---- */
.chrome{background:var(--chrome);color:var(--chrome-ink);flex:none}
.bar1{display:flex;align-items:center;gap:10px;padding-block:10px 8px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:0;flex:none}
.brand .mk{width:26px;height:30px;position:relative;flex:none}
.brand .mk i{position:absolute;inset:0;background:var(--accent);border-radius:4px;clip-path:polygon(0 0,64% 0,100% 28%,100% 100%,0 100%)}
.brand .mk i::after{content:"";position:absolute;top:0;left:64%;width:36%;height:28%;background:#bff0e4;opacity:.9}
.brand .mk b{position:absolute;right:5px;left:5px;bottom:8px;height:4px;border-radius:2px;background:var(--mark)}
.brand .mk b::before{content:"";position:absolute;right:0;width:65%;top:-7px;height:2px;border-radius:2px;background:rgba(255,255,255,.75)}
.doc{flex:4 1 auto;min-width:0;display:flex;align-items:center;gap:10px;background:var(--chrome-2);border:1px solid var(--chrome-line);border-radius:10px;padding:6px 10px;text-align:right;color:var(--chrome-ink);max-width:460px}
.doc:hover{border-color:var(--chrome-muted)}
.doc .di{width:28px;height:28px;border-radius:7px;background:rgba(52,196,167,.14);color:var(--accent);display:grid;place-items:center;flex:none}
.doc .di svg.i{width:17px;height:17px}
.doc .dt{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.doc .dt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.doc .dt small{color:var(--chrome-muted);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.doc .dirty{display:inline-flex;align-items:center;gap:5px;color:var(--mark);font-size:11.5px;margin-inline-start:auto;white-space:nowrap;flex:none}
.doc .dirty::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mark)}
.doc .dirty[hidden]{display:none!important}
.sp{flex:1}
.cbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--chrome-line);background:transparent;color:var(--chrome-ink);border-radius:10px;padding:8px 12px;font-weight:500;flex:none}
.cbtn:hover:not(:disabled){background:var(--chrome-2);border-color:var(--chrome-muted)}
.cbtn.icon{padding:8px}
.cbtn:disabled{opacity:.35;cursor:default}
.cbtn.primary{background:var(--accent);border-color:var(--accent);color:#04201a;font-weight:700}
.cbtn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.cgroup{display:flex;gap:2px;border:1px solid var(--chrome-line);border-radius:10px;padding:2px}
.cgroup .cbtn{border:0;padding:6px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:0 0}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:9px 14px 11px;font-weight:500;color:var(--chrome-muted);white-space:nowrap;border-radius:10px 10px 0 0;position:relative}
.tab svg.i{width:17px;height:17px}
.tab:hover{color:var(--chrome-ink)}
.tab[aria-selected="true"]{color:var(--ink);background:var(--surface)}
.tab[aria-selected="true"] svg.i{color:var(--accent)}

/* ---- ribbon ---- */
.ribbon{background:var(--surface);border-bottom:1px solid var(--line);flex:none;position:relative;z-index:3}
.toolbar{display:flex;align-items:stretch;gap:2px;overflow-x:auto;padding-block:6px 4px;scrollbar-width:thin}
.toolbar[hidden]{display:none!important}
.tg{display:flex;flex-direction:column;align-items:stretch;flex:none;padding-inline:6px;border-inline-start:1px solid var(--line)}
.tg:first-child{border-inline-start:0;padding-inline-start:0}
.tgi{display:flex;align-items:center;gap:2px;flex:1}
.tgl{font-size:10.5px;color:var(--muted);text-align:center;letter-spacing:.02em;padding-top:2px;white-space:nowrap}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:52px;padding:6px 6px 5px;border-radius:9px;border:1px solid transparent;background:none;font-size:11.5px;color:var(--ink);flex:none;position:relative;transition:background .12s,color .12s}
.tb:hover:not(:disabled){background:var(--raise);border-color:var(--line)}
.tb.on{background:var(--accent-soft);color:var(--accent-strong);border-color:color-mix(in srgb,var(--accent) 45%,transparent);font-weight:700}
.tb:disabled{opacity:.35;cursor:default}
.tb .cd{position:absolute;top:5px;left:9px;width:9px;height:9px;border-radius:50%;background:var(--c,transparent);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line-strong)}
.zoomval{min-width:54px;align-self:center;text-align:center;font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:5px 0}

/* ---- property strip ---- */
.props{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px;background:var(--raise);border-bottom:1px solid var(--line);flex:none;position:relative;z-index:2}
.props[hidden]{display:none!important}
.pv{width:104px;height:46px;border-radius:10px;background:#fff;border:1px solid var(--line);flex:none;display:block;box-shadow:var(--shadow-sm)}
.pgroup{display:flex;flex-direction:column;gap:6px;min-width:0}
.plabel{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.03em}
.swatches{display:flex;flex-wrap:wrap;gap:7px}

/* ---- workspace ---- */

async function saveFile(filename,data){
  // Standalone-browser path first; Claude downloads remains an optional fallback.
  try{
    const blob=data instanceof Blob?data:new Blob([data]);
    if(navigator.canShare&&navigator.share&&typeof File!=='undefined'){
      const f=new File([blob],filename,{type:blob.type||'application/octet-stream'});
      if(!navigator.canShare({files:[f]})){/* continue to download fallback */}
      else{await navigator.share({files:[f],title:filename});toast('تم فتح قائمة المشاركة والحفظ');return true;}
    }
    const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);toast('بدأ تنزيل الملف');return true;
  }catch(e){
    if(e&&e.name==='AbortError'){toast('أُلغي الحفظ');return false;}
    console.warn('Native save fallback failed',e);
  }
  if(!DL)await Promise.race([dlReady,new Promise(r=>setTimeout(r,1200))]);
  if(!DL){toast('تعذّر الحفظ تلقائياً في هذا المتصفح. جرّب قائمة المشاركة أو افتح الملف في Safari.',4500);return false;}
  try{await DL.save({filename,data});toast('تم إرسال الملف للحفظ');return true;}
  catch(e){const c=e&&e.code;if(c==='declined')toast('أُلغي الحفظ');else if(c==='rate_limited')toast('هناك نافذة حفظ مفتوحة، انتظر قليلاً ثم أعد المحاولة');else if(c==='too_large')toast('الملف كبير جداً لهذا العرض، جرّب أداة الضغط أولاً',4000);else toast('تعذّر الحفظ في هذا العرض',3500);return false;}
}

/* ---------- undo ---------- */
function snap(){return JSON.stringify({pages:S.pages,settings:S.settings});}
function undoLabel(){const t=TOOL_INFO&&TOOL_INFO[S.tool]?TOOL_INFO[S.tool][1]:'تعديل';return (S.tab==='pages'?'تعديل الصفحات':t)+(S.pages.length>1?'، صفحة '+ar((S.cur||0)+1):'');}
let undoBytes=0;
function pushUndo(label){const e={s:snap(),t:Date.now(),label:label||undoLabel()};S.undo.push(e);
  // keep up to 200 steps, but never more than ~40 MB of history
  let tot=S.undo.reduce((a,x)=>a+(x.s||x).length,0);while(S.undo.length>200||(tot>4e7&&S.undo.length>5)){tot-=(S.undo[0].s||S.undo[0]).length;S.undo.shift();}
  S.redo=[];updUndo();}
function restore(str){if(str&&typeof str==='object')str=str.s;const before=S.pages.map(p=>p.id+p.rot+(p.filter||'')).join();const o=JSON.parse(str);S.pages=o.pages;S.settings=o.settings;S.sel=null;S.msel=null;$('#selbar').hidden=true;
  const after=S.pages.map(p=>p.id+p.rot+(p.filter||'')).join();if(before!==after)refreshAll();else redrawAll();markDirty();updUndo();updSelBtns();}
// while a shape is still being drawn point by point, Undo / Redo step through its points
function gpolyBack(){const g=S.gpoly;if(!g||!g.pts.length)return false;const id=g.id;(g.rd=g.rd||[]).push({q:g.pts.pop(),s:g.snap.pop()});g.t=0;if(!g.pts.length){S.gpoly=null;drawOverlay(id);}else liveDraw(id);renderProps();updUndo();return true;}
function gpolyForward(){const g=S.gpoly;if(!g||!g.rd||!g.rd.length)return false;const r=g.rd.pop();g.pts.push(r.q);g.snap.push(r.s);g.t=0;liveDraw(g.id);renderProps();updUndo();return true;}
function doUndo(){if(gpolyBack())return;if(!S.undo.length)return;const e=S.undo.pop();S.redo.push({s:snap(),t:Date.now(),label:e.label||'تعديل'});restore(e);}
function doRedo(){if(gpolyForward())return;if(!S.redo.length)return;const e=S.redo.pop();S.undo.push({s:snap(),t:Date.now(),label:e.label||'تعديل'});restore(e);}
function historySheet(){
  const steps=S.undo.slice().reverse(),redo=S.redo.slice().reverse();const tm=t=>{const d=new Date(t);let h=d.getHours();const m=d.getMinutes();const ap=h<12?'ص':'م';h=h%12||12;return ar(h)+':'+ar(String(m).padStart(2,'0'))+' '+ap;};

    <div class="hist">${redo.length?redo.map((e,i)=>`<button data-hr="${redo.length-i}" class="fut"><span>${ic('redo')}</span><b>${esc(e.label||'تعديل')}</b><small>إعادة</small></button>`).join(''):''}
      <div class="now"><span>${ic('check')}</span><b>الحالة الحالية</b><small>${tm(Date.now())}</small></div>
      ${steps.length?steps.map((e,i)=>`<button data-hu="${i+1}"><span>${ic('undo')}</span><b>${esc(e.label||'تعديل')}</b><small>${e.t?tm(e.t):''}</small></button>`).join(''):'<p class="hint">لا توجد خطوات بعد في هذه الجلسة.</p>'}</div>
    <p class="subh" style="margin-top:4px">${ic('clock')} النسخ السابقة من الملف</p>
    <div class="hist">${vers.length?vers.map((v,i)=>`<button data-hv="${vers.length-1-i}"><span>${ic('file')}</span><b>${fmtWhen(v.t)}</b><small>${cnt(v.n||0,'page')}، ${ar(v.a||0)} تعليق</small></button>`).join(''):'<p class="hint">تُحفظ نسخة تلقائياً كل ١٥ دقيقة من العمل على الملف.</p>'}</div>
    <div class="acts"><button class="hbtn primary" data-close>تم</button></div>`);
  wireClose();

}

/* ---------- loading documents ---------- */
async function pdfFromBytes(bytes,password){
  return await pdfjs.getDocument({data:bytes.slice(),password,isEvalSupported:false,disableFontFace:false,...(window.SAFAHAT_NATIVE?{cMapUrl:'lib/cmaps/',cMapPacked:true,standardFontDataUrl:'lib/standard_fonts/'}:{})}).promise;
}
async function addPdf(buf,name){
  const bytes=new Uint8Array(buf);let pdf,encrypted=false;
  try{pdf=await pdfFromBytes(bytes);}
  catch(e){
    if(e&&e.name==='PasswordException'){
      let pw=await askPassword(name,false);
      while(pw!==null){try{pdf=await pdfFromBytes(bytes,pw);encrypted=true;break;}catch(e2){pw=await askPassword(name,true);}}
      if(!pdf)return [];
    }else{toast('تعذّر فتح الملف: '+name,4000);return [];}
  }
  const idx=S.sources.push({name,bytes,pdf,encrypted})-1;
  const out=[];
  for(let n=1;n<=pdf.numPages;n++){const pg=await pdf.getPage(n);const v=pg.getViewport({scale:1,rotation:pg.rotate});
    out.push({id:nid(),src:{kind:'pdf',doc:idx,n,inh:pg.rotate||0,bw:v.width,bh:v.height},rot:0,annots:[]});}
  // existing bookmarks (outline) of the file
  try{const ol=await pdf.getOutline();
    if(ol&&ol.length){const walk=async(items,l)=>{for(const it of items){let k=-1;
        try{let d=it.dest;if(typeof d==='string')d=await pdf.getDestination(d);if(Array.isArray(d)&&d[0]!=null)k=typeof d[0]==='object'?await pdf.getPageIndex(d[0]):+d[0];}catch(e){}
        if(k>=0&&out[k])pendingBms.push({t:String(it.title||'—').trim()||'—',id:out[k].id,lvl:l});
        if(it.items&&it.items.length&&l<4)await walk(it.items,l+1);}};
      await walk(ol,0);}}catch(e){}
  return out;
}
async function imgPage(file){
  const url=await readFile(file,'url');let el;
  try{el=await loadImg(url);}catch(e){toast('صيغة الصورة غير مدعومة: '+file.name,3500);return null;}
  const max=2400,k=Math.min(1,max/Math.max(el.naturalWidth,el.naturalHeight));
  const c=mkCanvas(el.naturalWidth*k,el.naturalHeight*k),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(el,0,0,c.width,c.height);
  const key=await addImg(c.toDataURL('image/jpeg',.9));
  const bw=595.28,bh=bw*c.height/c.width;
  return {id:nid(),src:{kind:'img',key,inh:0,bw,bh},rot:0,annots:[]};
}
async function filesToPages(files){
  const out=[];
  for(const f of files){
    if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){out.push(...await addPdf(await readFile(f),f.name));}
    else if(f.type.startsWith('image/')){const p=await imgPage(f);if(p)out.push(p);}
    else toast('نوع غير مدعوم: '+f.name);
  }
  return out;
}
async function openFiles(files,{append=false,quiet=false,noLib=false}={}){
  if(!files.length)return;
  showBusy(append?'جارٍ إضافة الملفات…':'جارٍ فتح الملف…');
  const oldSources=S.sources;
  if(!append){S.sources=[];clearCaches();}
  pendingBms=[];
  try{
    const pages=await filesToPages([...files]);
    if(!pages.length){if(!append)S.sources=oldSources;hideBusy();return;}
    if(append){pushUndo();const at=S.pages.length;S.pages.push(...pages);if(pendingBms.length)S.settings.bms=[...(S.settings.bms||[]),...pendingBms];markDirty();refreshAll();hideBusy();toast('أُضيفت '+ar(pages.length)+' صفحة');if(inViewer())scrollToPage(at);}
    else{
      S.pages=pages;S.isSample=false;S.undo=[];S.redo=[];S.versions=[];S.settings={wm:null,pn:null,bms:pendingBms.slice()};S.sel=null;S.selectedPages.clear();
      S.libId=null;S.libLocked=false;chatHist=[];renderChat();
      S.name=files[0].name.replace(/\.[^.]+$/,'')+(files.length>1?' وغيرها':'');
      S.docId=null;markDirty(false);updUndo();setName();refreshAll();hideBusy();
      if(DB&&!noLib)await libAdopt(realFolder());
      if(!quiet){showEditor();setTab(S.tab==='tools'||S.tab==='ai'?S.tab:'view');}
    }
  }catch(e){console.error(e);hideBusy();toast('حدث خطأ أثناء قراءة الملف',3500);}
  setName();updSize();
}

const viewer=$('#viewer');const views=new Map();
const io=new IntersectionObserver(es=>{for(const e of es){const v=views.get(e.target.dataset.id);if(!v)continue;v.vis=e.isIntersecting;if(v.vis)renderView(e.target.dataset.id);}},{root:viewer,rootMargin:'600px 0px'});
function buildViewer(){
  io.disconnect();views.clear();viewer.innerHTML='';
  S.pages.forEach((p,i)=>{
    const el=document.createElement('div');el.className='page';el.dataset.id=p.id;
    const c=document.createElement('canvas');c.className='pc';const o=document.createElement('canvas');o.className='ov';try{o.getContext('2d',{desynchronized:true});}catch(_){}
    const lab=document.createElement('div');lab.className='pnum';lab.textContent='صفحة '+ar(i+1)+' من '+ar(S.pages.length);
    el.append(c,o,lab);viewer.appendChild(el);attachOverlay(o,p.id);el.addEventListener('click',e=>pageClick(e,p.id,el));
    views.set(p.id,{el,c,o,key:'',vis:false});io.observe(el);
  });
  layoutViewer();
  $('#total').textContent=ar(S.pages.length);
}
const vdpr=v=>Math.min(DPR,Math.sqrt(15e6/Math.max(1,v.cssW*v.cssH)));
function layoutViewer(){
  const avail=Math.max(200,viewer.clientWidth-32);
  const base=(S.layout==='spread'?Math.min((avail-24)/2,640):Math.min(avail,880))*S.zoom;
  for(const p of S.pages){const v=views.get(p.id);if(!v)continue;const d=dims(p);
    v.cssW=base;v.cssH=base*d.h/d.w;v.el.style.width=base+'px';v.el.style.height=v.cssH+'px';
    if(v.vis)renderView(p.id);}
  $('#zoomVal')&&($('#zoomVal').textContent=ar(Math.round(S.zoom*100))+'٪');
  if(typeof positionSelbar==='function')requestAnimationFrame(positionSelbar);
}
async function paintSource(p,ctx,W,H){await paintSource0(p,ctx,W,H);if(p.filter&&p.filter!=='none'){const d=ctx.getImageData(0,0,W,H);applyFilterData(d,p.filter);ctx.putImageData(d,0,0);}}
async function paintSource0(p,ctx,W,H){
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  const s=p.src;
  if(s.kind==='pdf'){
    const pg=await S.sources[s.doc].pdf.getPage(s.n);const d=dims(p);
    const vp=pg.getViewport({scale:W/d.w,rotation:(s.inh+p.rot)%360});
    await pg.render({canvasContext:ctx,viewport:vp}).promise;
  }else if(s.kind==='img'){
    const im=S.imgs[s.key];if(!im)return;const odd=p.rot%180;
    ctx.save();ctx.translate(W/2,H/2);ctx.rotate(p.rot*Math.PI/180);
    const iw=odd?H:W,ih=odd?W:H;ctx.drawImage(im.el,-iw/2,-ih/2,iw,ih);ctx.restore();
  }
}
async function renderView(id){
  const v=views.get(id),p=byId(id);if(!v||!p)return;
  const key=v.cssW+'|'+p.rot+'|'+(p.filter||'')+'|'+vdpr(v).toFixed(3);if(v.key===key){return;}
  v.key=key;const k=vdpr(v),W=Math.round(v.cssW*k),H=Math.round(v.cssH*k);
  const tmp=mkCanvas(W,H);
  try{await paintSource(p,tmp.getContext('2d'),W,H);}catch(e){console.warn(e);}
  if(v.key!==key)return;
  v.c.width=W;v.c.height=H;v.c.getContext('2d').drawImage(tmp,0,0);
  drawOverlay(id);
}
function redrawAll(){for(const p of S.pages)drawOverlay(p.id);}
function drawOverlay(id){railRefreshSoon(id);
  const v=views.get(id),p=byId(id);if(!v||!p)return;
  const vk=vdpr(v),W=Math.round(v.cssW*vk),H=Math.round(v.cssH*vk);
  if(v.o.width!==W||v.o.height!==H){v.o.width=W;v.o.height=H;}
  const x=v.o.getContext('2d');x.clearRect(0,0,W,H);
  paintAnnots(x,p,W,H,S.pages.indexOf(p),S.pages.length);
  if(drag&&drag.kind==='draw'&&drag.id===id)drawA(x,drag.a,W,H);
  if(drag&&drag.kind==='mark'&&drag.id===id){if(drag.a)drawA(x,drag.a,W,H);x.save();x.strokeStyle='rgba(15,138,116,.7)';x.setLineDash([5*DPR,4*DPR]);x.lineWidth=1.2*DPR;
    x.strokeRect(Math.min(drag.start[0],drag.cur[0])*W,Math.min(drag.start[1],drag.cur[1])*H,Math.abs(drag.cur[0]-drag.start[0])*W,Math.abs(drag.cur[1]-drag.start[1])*H);x.restore();}
  if(S.tool==='edittext')drawRunHints(x,p,W,H,drag&&drag.kind==='etext'&&drag.id===id?drag:null);
  if(S.gpoly&&S.gpoly.id===id){const g=S.gpoly,sp=S.props.shape;drawA(x,{type:'poly',pts:g.hover?g.pts.concat([g.hover]):g.pts,closed:false,preview:true,color:sp.color,w:sp.w||.004},W,H);}
  if(S.tool==='poly'&&!S.gpoly){const vv=views.get(id),k=W/vv.cssW;x.save();x.fillStyle='rgba(245,158,11,.9)';for(const a of p.annots)if(a.type==='poly')for(const q of a.pts){x.beginPath();x.arc(q[0]*W,q[1]*H,3.2*k,0,Math.PI*2);x.fill();}x.restore();}
  if(S.mpoly&&S.mpoly.id===id){const mp=S.mpoly;drawA(x,{type:'measure',mk:mp.mk,pts:mp.hover&&!(mp.mk==='angle'&&mp.pts.length>=3)?mp.pts.concat([mp.hover]):mp.pts,closed:false,preview:true,...mprops(p)},W,H);}
  if(S.icrop&&S.icrop.id===id)drawCrop(x,p,W,H);
  else if(S.msel&&S.msel.id===id)drawMsel(x,p,W,H);
  if(drag&&drag.kind==='lasso'&&drag.id===id)drawLasso(x,drag.pts,W,H);
  if(S.sel&&S.sel.id===id&&S.sel.a&&p.annots.includes(S.sel.a)){const b=bbox(S.sel.a,W/H);x.save();x.strokeStyle='#0b6e5f';x.setLineDash([6*DPR,4*DPR]);x.lineWidth=1.5*DPR;
    x.strokeRect((b.x-.006)*W,(b.y-.006*W/H)*H,(b.w+.012)*W,(b.h+.012*W/H)*H);x.restore();}
}

const textCache={};
// some PDFs store Arabic in visual (reversed) order; detect it per line and restore reading order
function fixVisualAr(line){if(!/[\u0621-\u064A]/.test(line))return line;

    if(/^[ةى]/.test(w))rev+=2;if(/ة$|ى$/.test(w))norm+=2;if(/^ال/.test(w))norm+=1.5;if(/لا$/.test(w)&&w.length>3)rev+=1.5;}

async function pageText(p){
  if(p.ocr)return p.ocr;
  if(p.src.kind!=='pdf')return '';
  const k=p.src.doc+':'+p.src.n;if(textCache[k]!=null)return textCache[k];
  try{const pg=await S.sources[p.src.doc].pdf.getPage(p.src.n);const tc=await pg.getTextContent();
    const lines=[];let cur='',lastY=null;
    for(const it of tc.items){if(!('str' in it))continue;const y=Math.round(it.transform[5]);
      if(lastY!==null&&Math.abs(y-lastY)>3&&cur){lines.push(cur);cur='';}
      cur+=it.str.normalize('NFKC');if(it.hasEOL){lines.push(cur);cur='';}lastY=y;}
    if(cur)lines.push(cur);
    textCache[k]=lines.map(l=>fixVisualAr(l.replace(/\s+/g,' ').trim())).filter(Boolean).join('\n');
  }catch(e){textCache[k]='';}
  return textCache[k];
}

}

/* ---------- page operations ---------- */
function rotAnnots(p,cw){
  const d=dims(p),r=d.w/d.h;
  for(const a of p.annots){
    const f=cw?([x,y])=>[1-y,x]:([x,y])=>[y,1-x];
    if(a.type==='image'){const c=f([a.pts[0][0]+a.w/2,a.pts[0][1]+a.h/2]);const nw=a.w*r,nh=a.h/r;a.w=nw;a.h=nh;a.pts=[[c[0]-nw/2,c[1]-nh/2]];}
    else{a.pts=a.pts.map(f);if(a.size)a.size*=r;if(a.w)a.w*=r;}
  }
}
function rotatePage(p,cw=true){rotAnnots(p,cw);p.rot=(p.rot+(cw?90:270))%360;}
function clonePage(p){const c=JSON.parse(JSON.stringify(p));c.id=nid();return c;}
function blankPage(){const ref=S.pages[S.cur]||S.pages[0];const bw=ref?ref.src.bw:595.28,bh=ref?ref.src.bh:841.89;
  const [w,h]=ref&&ref.rot%180?[bh,bw]:[bw,bh];return {id:nid(),src:{kind:'blank',inh:0,bw:w,bh:h},rot:0,annots:[]};}

function selectedOrCurrent(){const sel=S.pages.filter(p=>S.selectedPages.has(p.id));return sel;}
function pageOp(name){
  const sel=selectedOrCurrent();
  if(name==='all'){if(S.selectedPages.size===S.pages.length)S.selectedPages.clear();else S.pages.forEach(p=>S.selectedPages.add(p.id));renderGrid();return;}
  if(name==='blank'){pushUndo();const at=Math.min(S.pages.length,S.cur+1);S.pages.splice(at,0,blankPage());markDirty();refreshAll();toast('أُضيفت صفحة فارغة بعد الصفحة '+ar(at));return;}
  if(name==='add'){$('#fileAdd').click();return;}
  if(name==='rev'){pushUndo();S.pages.reverse();markDirty();refreshAll();return;}
  if(!sel.length){toast('حدّد صفحة واحدة على الأقل');return;}
  if(name==='rot'){pushUndo();sel.forEach(p=>rotatePage(p));markDirty();refreshAll();}
  if(name==='dup'){pushUndo();sel.slice().reverse().forEach(p=>{const i=S.pages.indexOf(p);S.pages.splice(i+1,0,clonePage(p));});markDirty();refreshAll();}
  if(name==='del'){if(sel.length===S.pages.length){toast('لا يمكن حذف كل الصفحات');return;}pushUndo();S.pages=S.pages.filter(p=>!S.selectedPages.has(p.id));S.selectedPages.clear();markDirty();refreshAll();toast('حُذفت '+ar(sel.length)+' صفحة — يمكنك التراجع');}
  if(name==='ext'){exportPages(sel,baseName()+' - صفحات مختارة.pdf');}
}

let gridToken=0;
function renderGrid(){
  const g=$('#grid');g.innerHTML='';const tok=++gridToken;
  S.pages.forEach((p,i)=>{
    const card=document.createElement('div');card.className='card'+(S.selectedPages.has(p.id)?' sel':'');
    card.innerHTML=`<div class="chead"><span>${ar(i+1)}${p.filter?`<span class="badge">${FNAME[p.filter]}</span>`:''}</span><input type="checkbox" id="ck_${p.id}" aria-label="تحديد الصفحة ${ar(i+1)}" ${S.selectedPages.has(p.id)?'checked':''}></div>
      <button class="thumb" aria-label="فتح الصفحة ${ar(i+1)}"><canvas></canvas></button>
      <div class="cact">
        <button class="mini" data-a="up" title="نقل للأمام">${ic('next')}</button>

        <button class="mini" data-a="dup" title="نسخ">${ic('copy')}</button>
        <button class="mini" data-a="del" title="حذف">${ic('trash')}</button>
        <button class="mini" data-a="down" title="نقل للخلف">${ic('prev')}</button>
      </div>`;
    card.querySelector('input').addEventListener('change',e=>{e.target.checked?S.selectedPages.add(p.id):S.selectedPages.delete(p.id);card.classList.toggle('sel',e.target.checked);});
    card.querySelector('.thumb').addEventListener('click',()=>{setTab('view');requestAnimationFrame(()=>scrollToPage(S.pages.indexOf(p)));});
    card.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>{
      const k=S.pages.indexOf(p),a=b.dataset.a;
      if(a==='up'&&k>0){pushUndo();[S.pages[k-1],S.pages[k]]=[S.pages[k],S.pages[k-1]];}
      else if(a==='down'&&k<S.pages.length-1){pushUndo();[S.pages[k+1],S.pages[k]]=[S.pages[k],S.pages[k+1]];}
      else if(a==='rot'){pushUndo();rotatePage(p);}
      else if(a==='dup'){pushUndo();S.pages.splice(k+1,0,clonePage(p));}
      else if(a==='del'){if(S.pages.length<2){toast('لا يمكن حذف الصفحة الوحيدة');return;}pushUndo();S.pages.splice(k,1);S.selectedPages.delete(p.id);}
      else return;
      markDirty();refreshAll();}));
    g.appendChild(card);
  });
  (async()=>{const cs=g.querySelectorAll('.thumb canvas');for(let i=0;i<S.pages.length;i++){if(tok!==gridToken)return;const p=S.pages[i],d=dims(p);
    const W=260,H=W*d.h/d.w;try{const c=await renderFull(p,i,S.pages.length,W,H);const t=cs[i];if(!t)return;t.width=c.width;t.height=c.height;t.getContext('2d').drawImage(c,0,0);}catch(e){}}})();
}

/* ---------- convert to PDF (text, table, Word) + compare two files ---------- */
const PG_AR=/[\u0600-\u06FF]/;
async function textToCanvases(items,{size=13,landscape=false}={}){
  const SC=2,W=landscape?841.89:595.28,H=landscape?595.28:841.89,M=48,lh=size*1.6,fam=fontStack(lastFont());
  try{await document.fonts.ready;}catch(e){}
  const pages=[];let c,x,y;
  const np=()=>{c=document.createElement('canvas');c.width=Math.round(W*SC);c.height=Math.round(H*SC);x=c.getContext('2d');x.scale(SC,SC);x.fillStyle='#fff';x.fillRect(0,0,W,H);x.textBaseline='top';y=M;pages.push(c);};
  np();const maxW=W-2*M;
  for(const it of items){
    const t=typeof it==='string'?it:it.t,col=(it&&it.c)||'#111',bold=!!(it&&it.b);
    if(!t.trim()){y+=lh*.6;continue;}
    x.font=`${bold?700:400} ${size}px ${fam}`;const rtl=PG_AR.test(t);x.direction=rtl?'rtl':'ltr';x.textAlign=rtl?'right':'left';
    const out=[];let line='';
    for(const w of t.split(' ')){const test=line?line+' '+w:w;if(line&&x.measureText(test).width>maxW){out.push(line);line=w;}else line=test;}
    out.push(line);
    const fin=[];for(let ln of out){while(ln.length>1&&x.measureText(ln).width>maxW){let k=ln.length;while(k>1&&x.measureText(ln.slice(0,k)).width>maxW)k--;fin.push(ln.slice(0,k));ln=ln.slice(k);}fin.push(ln);}
    for(const ln of fin){if(y+lh>H-M)np();x.font=`${bold?700:400} ${size}px ${fam}`;x.direction=rtl?'rtl':'ltr';x.textAlign=rtl?'right':'left';x.fillStyle=col;x.fillText(ln,rtl?W-M:M,y);y+=lh;}
  }
  return pages;
}
function parseCsv(txt){
  txt=txt.replace(/^\uFEFF/,'');const first=txt.split('\n')[0]||'';
  const d=[',',';','\t'].map(s=>[s,first.split(s).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"')q=true;else if(ch===d){row.push(cell);cell='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(v=>v.trim()))rows.push(row);row=[];}
    else cell+=ch;}
  row.push(cell);if(row.some(v=>v.trim()))rows.push(row);return rows;
}
async function csvToCanvases(rows){
  const nc=Math.max(...rows.map(r=>r.length)),landscape=nc>5,SC=2,W=landscape?841.89:595.28,H=landscape?595.28:841.89,M=36,fam=fontStack(lastFont()),size=10.5,rh=24;
  try{await document.fonts.ready;}catch(e){}
  const rtl=rows.some(r=>r.some(v=>PG_AR.test(v)));
  const len=Array.from({length:nc},(_,j)=>Math.min(40,Math.max(4,...rows.slice(0,200).map(r=>(r[j]||'').length))));
  const tot=len.reduce((a,b)=>a+b,0),cw=len.map(l=>(W-2*M)*l/tot);
  const xs=[];let acc=0;cw.forEach(w=>{xs.push(acc);acc+=w;});
  const pages=[];let c,x,y;
  const clip=(t,w)=>{if(x.measureText(t).width<=w)return t;while(t.length>1&&x.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…';};
  const drawRow=(r,head,zebra)=>{
    if(head){x.fillStyle='#dcefe9';x.fillRect(M,y,W-2*M,rh);}else if(zebra){x.fillStyle='#f5f8f7';x.fillRect(M,y,W-2*M,rh);}
    x.fillStyle='#111';x.font=`${head?700:400} ${size}px ${fam}`;x.direction=rtl?'rtl':'ltr';x.textAlign=rtl?'right':'left';
    for(let j=0;j<nc;j++){const pad=6,w=cw[j]-2*pad,px=rtl?W-M-xs[j]-pad:M+xs[j]+pad;x.fillText(clip(String(r[j]||''),w),px,y+6);}
    x.strokeStyle='#c8d2d0';x.lineWidth=.6;x.beginPath();x.moveTo(M,y+rh);x.lineTo(W-M,y+rh);x.stroke();y+=rh;};
  const np=()=>{c=document.createElement('canvas');c.width=Math.round(W*SC);c.height=Math.round(H*SC);x=c.getContext('2d');x.scale(SC,SC);x.fillStyle='#fff';x.fillRect(0,0,W,H);x.textBaseline='top';y=M;pages.push(c);drawRow(rows[0],true,false);};
  np();for(let i=1;i<rows.length;i++){if(y+rh>H-M)np();drawRow(rows[i],false,i%2===0);}
  return pages;
}
async function docxItems(file){
  const z=await JSZip.loadAsync(await file.arrayBuffer()),f=z.file('word/document.xml');if(!f)throw new Error('docx');
  const xml=new DOMParser().parseFromString(await f.async('string'),'application/xml'),NS='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const ptext=p=>{let t='';[...p.getElementsByTagNameNS(NS,'*')].forEach(n=>{const l=n.localName;if(l==='t')t+=n.textContent;else if(l==='tab')t+=' ';else if(l==='br')t+='\n';});return t;};
  const out=[],body=xml.getElementsByTagNameNS(NS,'body')[0];
  for(const n of [...body.children]){
    if(n.localName==='p'){const st=n.getElementsByTagNameNS(NS,'pStyle')[0],sv=st?(st.getAttributeNS(NS,'val')||''):'',h=/^(Heading|Title|عنوان)/i.test(sv);
      ptext(n).split('\n').forEach(t=>out.push(h?{t,b:true}:t));}
    else if(n.localName==='tbl'){[...n.getElementsByTagNameNS(NS,'tr')].forEach(tr=>out.push([...tr.getElementsByTagNameNS(NS,'tc')].map(tc=>ptext(tc).replace(/\n/g,' ')).join('  |  ')));out.push('');}
  }
  return out;
}
async function pdfFromCanvases(cs){
  const doc=await PDFLib.PDFDocument.create();
  for(const c of cs){const img=await doc.embedJpg(b64bytes(c.toDataURL('image/jpeg',.92))),w=c.width/2,h=c.height/2,pg=doc.addPage([w,h]);pg.drawImage(img,{x:0,y:0,width:w,height:h});}
  return await doc.save();
}

async function convertOne(f){
  const ext=(f.name.split('.').pop()||'').toLowerCase(),nm=f.name.replace(/\.[^.]+$/,'');
  if(ext==='pdf'||/^image\//.test(f.type)){await openFiles([f],{append:S.pages.length>0});return;}
  showBusy('جارٍ التحويل إلى PDF…');
  try{let cs;
    if(ext==='txt'||ext==='md')cs=await textToCanvases((await f.text()).replace(/^\uFEFF/,'').split(/\r?\n/));
    else if(ext==='csv'||ext==='tsv'){const r=parseCsv(await f.text());if(!r.length)throw new Error('empty');cs=await csvToCanvases(r);}
    else if(ext==='docx')cs=await textToCanvases(await docxItems(f));
    else{hideBusy();toast('هذه الصيغة (.'+ext+') تحتاج برنامجها الأصلي. احفظها PDF منه ثم افتحها هنا',5200);return;}
    const bytes=await pdfFromCanvases(cs);hideBusy();await addGenerated(bytes,nm+'.pdf');
  }catch(e){console.error(e);hideBusy();toast('تعذّر تحويل الملف');}
}

function diffLines(a,b){
  let s=0;while(s<a.length&&s<b.length&&a[s].n===b[s].n)s++;
  let ea=a.length,eb=b.length;while(ea>s&&eb>s&&a[ea-1].n===b[eb-1].n){ea--;eb--;}
  const A=a.slice(s,ea),B=b.slice(s,eb),out=[];
  if(A.length*B.length>6e6){const sb=new Set(B.map(v=>v.n)),sa=new Set(A.map(v=>v.n));A.forEach(v=>{if(!sb.has(v.n))out.push({k:'-',...v});});B.forEach(v=>{if(!sa.has(v.n))out.push({k:'+',...v});});return out;}
  const n=A.length,m=B.length,w=m+1,dp=new Uint16Array((n+1)*w);
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i*w+j]=A[i].n===B[j].n?dp[(i+1)*w+j+1]+1:Math.max(dp[(i+1)*w+j],dp[i*w+j+1]);
  let i=0,j=0;while(i<n&&j<m){if(A[i].n===B[j].n){i++;j++;}else if(dp[(i+1)*w+j]>=dp[i*w+j+1]){out.push({k:'-',...A[i]});i++;}else{out.push({k:'+',...B[j]});j++;}}
  while(i<n){out.push({k:'-',...A[i]});i++;}while(j<m){out.push({k:'+',...B[j]});j++;}
  return out;
}

/* ---------- AI helpers: page ranges, citations, tables, layout-preserving translation ---------- */
function parseRange(str,n){const t=toLatin(String(str||'')).replace(/[،؛]/g,',').replace(/[–—إلى]+/g,'-');const out=new Set();
  for(const part of t.split(/[,\s]+/).filter(Boolean)){const m=part.match(/^(\d+)(?:-(\d+))?$/);if(!m)return null;let a=+m[1],b=m[2]?+m[2]:a;if(a>b)[a,b]=[b,a];for(let i=a;i<=b;i++)if(i>=1&&i<=n)out.add(i-1);}
  return out.size?[...out].sort((x,y)=>x-y):null;}
function aiRangeIdx(){const r=($('#aiRange')||{}).value||'all';if(r==='cur')return [S.cur];if(r==='custom'){const v=parseRange(($('#aiPages')||{}).value,S.pages.length);if(!v){toast('اكتب أرقام صفحات صحيحة، مثل: ١-٣، ٥');return null;}return v;}return S.pages.map((_,i)=>i);}
function aiRangeLabel(idx){const g=[];let st=idx[0],pv=idx[0];for(const i of idx.slice(1).concat([null])){if(i===pv+1){pv=i;continue;}g.push(st===pv?ar(st+1):ar(st+1)+'-'+ar(pv+1));st=pv=i;}return g.join('، ');}
async function textOf(idx,limit=60000){let out='';for(const i of idx){const t=await pageText(S.pages[i]);if(t)out+=`\n[صفحة ${i+1}]\n`+t+'\n';if(out.length>limit)break;}return out.slice(0,limit);}
function linkCites(h){return h.replace(/\((?:ص|صـ|صفحة|الصفحة|page|p\.)\s*\.?\s*([٠-٩0-9]+)((?:\s*[-–،,و]\s*[٠-٩0-9]+)*)\)/gi,(m,a,rest)=>{const first=+toLatin(a);return `<button class="cite" data-pg="${first}" title="الانتقال إلى الصفحة ${ar(first)}">${m}</button>`;});}

        p.annots.push({type:'edit',pts:[[l.x0,l.y0],[l.x1,l.y1]],text:t,orig:l.text,size,color:c.fg,bg:c.bg,bold:false,font:fnt,align:toAr?'right':'left',src:[l.x0,l.y0]});lines++;});
      drawOverlay(id);}

    if(lines)setTab('view');}
  catch(e){out.textContent=aiErr(e);if(JSON.stringify(S.pages.map(p=>p.annots.length))===before){S.undo.pop();updUndo();}}

const FILTERS=[['none','الأصلي'],['magic','سحري'],['shadow','بلا ظلال'],['sharp','وضوح النص'],['doc','مستند'],['gray','رمادي'],['vivid','زاهٍ'],['bright','فاتح']];
const FNAME=Object.fromEntries(FILTERS);
// local paper brightness, so shadows and uneven light can be divided out
function illumRows(d,W,H){
  const B=Math.max(12,Math.round(Math.max(W,H)/40));
  const gw=Math.ceil(W/B),gh=Math.ceil(H/B);const g=new Float32Array(gw*gh);const hist=new Uint16Array(64);
  const st=Math.max(1,Math.floor(B/6));
  for(let by=0;by<gh;by++)for(let bx=0;bx<gw;bx++){hist.fill(0);let n=0;
    const x1=Math.min(W,(bx+1)*B),y1=Math.min(H,(by+1)*B);
    for(let y=by*B;y<y1;y+=st)for(let x=bx*B;x<x1;x+=st){const i=(y*W+x)*4;hist[(d[i]*77+d[i+1]*150+d[i+2]*29)>>10]++;n++;}
    let acc=0,v=63;const t=n*.9;for(let k=0;k<64;k++){acc+=hist[k];if(acc>=t){v=k;break;}}
    g[by*gw+bx]=v*4+2;}

  for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){let m=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const yy=y+dy,xx=x+dx;if(yy<0||xx<0||yy>=gh||xx>=gw)continue;const v=g[yy*gw+xx];if(v>m)m=v;}g2[y*gw+x]=m;}
  for(let pass=0;pass<2;pass++){const o=new Float32Array(g2.length);for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){let s=0,c=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const yy=y+dy,xx=x+dx;if(yy<0||xx<0||yy>=gh||xx>=gw)continue;s+=g2[yy*gw+xx];c++;}o[y*gw+x]=s/c;}g2=o;}

  for(let x=0;x<W;x++){let fx=(x+.5)/B-.5;if(fx<0)fx=0;if(fx>gw-1)fx=gw-1;const i0=gw>1?Math.min(gw-2,Math.floor(fx)):0;xi0[x]=i0;xf[x]=gw>1?fx-i0:0;}

}
function lumHist(d){const h=new Uint32Array(256);for(let i=0;i<d.length;i+=16)h[(d[i]*77+d[i+1]*150+d[i+2]*29)>>8]++;return h;}

    const bgRow=illumRows(d,W,H);
    for(let y=0;y<H;y++){const row=bgRow(y);let i=y*W*4;for(let x=0;x<W;x++,i+=4){const k=250/Math.max(row[x],40);d[i]*=k;d[i+1]*=k;d[i+2]*=k;}}

      const L=new Uint8Array(W*H);for(let j=0,i=0;j<L.length;j++,i+=4)L[j]=(d[i]*77+d[i+1]*150+d[i+2]*29)>>8;

      for(let j=0,i=0;j<L.length;j++,i+=4){const diff=(L[j]-B[j])*1.6;for(let c=0;c<3;c++){let v=d[i+c]+diff;v=(v-128)*1.12+128;if(v>238)v=255;d[i+c]=v;}}}

      for(let x=0;x<W;x++,i+=4){const k=255/Math.max(row[x],48);let r=d[i]*k,g=d[i+1]*k,b=d[i+2]*k;
        if(f==='magic'){r=(r-38)*1.18;g=(g-38)*1.18;b=(b-38)*1.18;const l=r*.299+g*.587+b*.114;d[i]=l+(r-l)*1.28;d[i+1]=l+(g-l)*1.28;d[i+2]=l+(b-l)*1.28;}

}
/* automatic skew correction for text pages (projection profile) — returns degrees */
function estimateSkew(img){const W=img.width,H=img.height,d=img.data,sc=Math.min(1,700/Math.max(W,H)),w=Math.max(2,Math.round(W*sc)),h=Math.max(2,Math.round(H*sc));

function boxBlurU8(a,w,h,r){const t=new Uint8Array(a.length),o=new Uint8Array(a.length);

/* ---------- text geometry: reuse the line runs used by text editing ---------- */
async function pageItems(p){if(!p||p.src.kind!=='pdf')return [];return (await pageRuns(p)).flatMap(l=>l.parts);}
function linesOf(items){const lines=[];
  for(const it of items.slice().sort((p,q)=>p.y0-q.y0)){const cy=(it.y0+it.y1)/2,h=it.y1-it.y0;
    let L=lines.find(l=>Math.abs(l.cy-cy)<Math.max(h,l.h)*.5);
    if(L){L.items.push(it);L.x0=Math.min(L.x0,it.x0);L.x1=Math.max(L.x1,it.x1);L.y0=Math.min(L.y0,it.y0);L.y1=Math.max(L.y1,it.y1);}
    else lines.push({cy,h,items:[it],x0:it.x0,x1:it.x1,y0:it.y0,y1:it.y1});}
  return lines.sort((a,b)=>a.cy-b.cy);}
function markUpd(id){const d=drag;if(!d||d.kind!=='mark')return;d.a=null;
  if(d.items&&d.items.length){
    const x0=Math.min(d.start[0],d.cur[0]),x1=Math.max(d.start[0],d.cur[0]),y0=Math.min(d.start[1],d.cur[1]),y1=Math.max(d.start[1],d.cur[1]);
    const sel=d.items.filter(it=>it.x1>x0&&it.x0<x1&&it.y1>y0&&it.y0<y1);
    const clip=x1-x0>.012;const pts=[];let txt=[];
    for(const L of linesOf(sel)){const a=clip?Math.max(L.x0,x0):L.x0,b=clip?Math.min(L.x1,x1):L.x1;if(b-a<.002)continue;pts.push([a,L.y0],[b,L.y1]);txt.push(L.items.map(i=>i.str).join(' '));}
    if(pts.length)d.a={type:'markup',style:d.style,color:d.color,op:d.op,pts,text:txt.join(' ').slice(0,300)};}
  drawOverlay(id);}

/* ---------- finishing the saved PDF: links, notes, outline, flattened forms ---------- */
function finishPdf(out,made){
  const {PDFName,PDFString,PDFHexString,PDFDict,PDFArray}=PDFLib;const ctx=out.context;let vn=0;
  const refOf=new Map(made.map(m=>[m.p.id,m.pg.ref]));
  const toPdf=(m,u,v)=>{let a=u,b=v;if(m.R===90){a=v;b=1-u;}else if(m.R===180){a=1-u;b=1-v;}else if(m.R===270){a=1-v;b=u;}return [m.box.x+a*m.box.width,m.box.y+(1-b)*m.box.height];};
  const annotsOf=pg=>{let arr=pg.node.lookupMaybe(PDFName.of('Annots'),PDFArray);if(!arr){arr=ctx.obj([]);pg.node.set(PDFName.of('Annots'),arr);}return arr;};
  const add=(pg,dict)=>annotsOf(pg).push(ctx.register(ctx.obj(dict)));
  for(const m of made){
    if(!m.raster&&m.p.annots.some(a=>a.type==='formval')){const arr=m.pg.node.lookupMaybe(PDFName.of('Annots'),PDFArray);
      if(arr)for(let i=arr.size()-1;i>=0;i--){const d=arr.lookupMaybe(i,PDFDict);if(d&&d.get(PDFName.of('Subtype'))===PDFName.of('Widget'))arr.remove(i);}}
    for(const a of m.p.annots){
      if(a.type==='link'){const p0=toPdf(m,a.pts[0][0],a.pts[0][1]),p1=toPdf(m,a.pts[1][0],a.pts[1][1]);
        const d={Type:'Annot',Subtype:'Link',Rect:[Math.min(p0[0],p1[0]),Math.min(p0[1],p1[1]),Math.max(p0[0],p1[0]),Math.max(p0[1],p1[1])],Border:[0,0,0],F:4};
        if(a.url)d.A={Type:'Action',S:'URI',URI:PDFString.of(a.url)};else if(a.pageId&&refOf.has(a.pageId))d.Dest=[refOf.get(a.pageId),'Fit'];else continue;
        add(m.pg,d);}
      else if(a.type==='voice'&&S.auds&&S.auds[a.vkey]){const c=toPdf(m,a.pts[0][0],a.pts[0][1]),s=m.box.width*.05,v=S.auds[a.vkey],mime=(/^data:([^;,]+)/.exec(v.url)||[])[1]||'audio/wav',ext=/wav/.test(mime)?'wav':/mp4|m4a|aac/.test(mime)?'m4a':/mpeg|mp3/.test(mime)?'mp3':/webm/.test(mime)?'webm':'audio',nm='voice-'+(++vn)+'.'+ext;
        const st=ctx.register(ctx.flateStream(b64bytes(v.url),{Type:'EmbeddedFile',Subtype:mime})),fsd=ctx.register(ctx.obj({Type:'Filespec',F:PDFString.of(nm),UF:PDFHexString.fromText(nm),Desc:PDFHexString.fromText('ملاحظة صوتية'),EF:{F:st,UF:st}}));
        add(m.pg,{Type:'Annot',Subtype:'FileAttachment',Rect:[c[0]-s/2,c[1]-s/2,c[0]+s/2,c[1]+s/2],FS:fsd,Name:'PushPin',Contents:PDFHexString.fromText('ملاحظة صوتية ('+fmtDur(a.dur)+')'),T:PDFHexString.fromText('ملاحظة صوتية'),C:hexRgb(a.color),F:4});}
      else if(a.type==='note'){const c=toPdf(m,a.pts[0][0],a.pts[0][1]),s=16;
        add(m.pg,{Type:'Annot',Subtype:'Text',Rect:[c[0]-s/2,c[1]-s/2,c[0]+s/2,c[1]+s/2],Contents:PDFHexString.fromText(a.text),T:PDFHexString.fromText('ملاحظة'),Name:'Comment',C:hexRgb(a.color),F:4,Open:false});}
    }}
  const bms=(S.settings.bms||[]).filter(b=>refOf.has(b.id));
  if(bms.length){
    const nodes=bms.map(b=>({b,ref:ctx.nextRef(),kids:[]}));const top=[],stack=[];
    for(const n of nodes){const l=Math.min(Math.max(0,n.b.lvl|0),stack.length);stack.length=l;(l?stack[l-1].kids:top).push(n);stack.push(n);}
    const root=ctx.nextRef();
    const emit=(list,parent)=>list.forEach((n,i)=>{const d={Title:PDFHexString.fromText(n.b.t),Parent:parent,Dest:[refOf.get(n.b.id),'Fit']};
      if(i>0)d.Prev=list[i-1].ref;if(i<list.length-1)d.Next=list[i+1].ref;
      if(n.kids.length){d.First=n.kids[0].ref;d.Last=n.kids[n.kids.length-1].ref;d.Count=n.kids.length;emit(n.kids,n.ref);}
      ctx.assign(n.ref,ctx.obj(d));});
    emit(top,root);
    ctx.assign(root,ctx.obj({Type:'Outlines',First:top[0].ref,Last:top[top.length-1].ref,Count:top.length}));
    out.catalog.set(PDFName.of('Outlines'),root);out.catalog.set(PDFName.of('PageMode'),PDFName.of('UseOutlines'));}
}

/* ---------- OCR: local Tesseract first, optional AI enhancement ---------- */
const OCR_LOCAL={src:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',worker:null};
async function getLocalOcrWorker(onProgress){
  if(!window.Tesseract)await loadScript(OCR_LOCAL.src);
  if(!window.Tesseract||!Tesseract.createWorker)throw new Error('ocr-library-unavailable');
  if(OCR_LOCAL.worker)return OCR_LOCAL.worker;
  OCR_LOCAL.worker=await Tesseract.createWorker('ara+eng',1,{logger:m=>{if(m&&m.status==='recognizing text'&&onProgress)onProgress(m.progress||0);},
    workerPath:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
    corePath:'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',
    langPath:'https://tessdata.projectnaptha.com/4.0.0'});
  return OCR_LOCAL.worker;
}
async function runLocalOcr(list,{enh,tab}){
  let worker=null,ok=0,fail=0;
  try{
    worker=await getLocalOcrWorker(()=>{});
    for(let n=0;n<list.length;n++){
      const i=list[n],p=S.pages[i];
      try{
        const d=dims(p),k=Math.min(1.8,1500/Math.max(d.w,d.h));
        const c=await renderFull(p,i,S.pages.length,Math.max(1,Math.round(d.w*k)),Math.max(1,Math.round(d.h*k)),{annots:false});
        if(enh&&!p.filter)filterCanvas(c,'sharp');
        const blob=await new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(new Error('canvas-blob-failed')),'image/jpeg',.88));
        const result=await worker.recognize(blob);
        let text=(result&&result.data&&result.data.text||'').replace(/\r/g,'').trim();
        if(tab)text=text.replace(/[ \t]+\n/g,'\n');
        p.ocr=text||' ';ok++;
      }catch(e){console.warn('OCR page failed',i+1,e);fail++;}
      setBusy((n+1)/list.length);
    }
  }finally{if(worker){try{await worker.terminate();}catch(e){}OCR_LOCAL.worker=null;}}
  return {ok,fail};
}
async function runAiOcr(list,{enh,tab,lim}){
  let ok=0,fail=0,stop=null;
  for(let n=0;n<list.length;n++){
    const i=list[n],p=S.pages[i];
    try{
      const d=dims(p),k=Math.min(2.4,1800/Math.max(d.w,d.h));const c=await renderFull(p,i,S.pages.length,d.w*k,d.h*k,{annots:false});if(enh&&!p.filter)filterCanvas(c,'sharp');
      let blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.88));const mx=lim.images.maxInputBytes||Infinity;if(blob&&blob.size>mx)blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.6));
      const r=await AI('هذه صورة صفحة من مستند. استخرج كل النص الظاهر فيها حرفياً كما هو، سطراً بسطر وبترتيب القراءة الصحيح (العربية من اليمين إلى اليسار). حافظ على الأرقام والرموز والمعادلات كما تظهر. لا تضف أي تعليق أو شرح أو تنسيق ماركداون. إن لم يكن في الصفحة نص فأعد الكلمة: فارغة'+(tab?'\nإن وُجد جدول فاكتب كل صف في سطر واحد وافصل الخلايا بالعلامة | وابدأ الجدول بسطر فيه [جدول] واختمه بسطر فيه [/جدول]. واكتب المعادلات والكسور والأسس كتابة خطية واضحة مثل ٣/٤ و س^٢ و √(س+١) مع الحفاظ على اتجاهها كما في الصورة.':''),{images:[blob],modelTier:'default',cache:false});
      const t=cleanAI(r.text);p.ocr=t==='فارغة'?' ':t;ok++;
    }catch(e){fail++;if(e&&['rate_limited','not_granted','images_unavailable'].includes(e.code)){stop=e;break;}}

  return {ok,fail,stop};
}

/* ---------- PDF to Excel / PowerPoint ---------- */
function itemsToRows(items,r){
  const rows=[];
  for(const L of linesOf(items)){const rtl=L.items.filter(i=>i.rtl).length*2>=L.items.length;
    const its=L.items.slice().sort((a,b)=>rtl?b.x1-a.x1:a.x0-b.x0);const cells=[];let cur=null,prev=null;
    for(const it of its){const hx=(it.y1-it.y0)/r;const gap=prev?(rtl?prev.x0-it.x1:it.x0-prev.x1):0;
      if(!cur||gap>hx*1.1){cur=[it.str];cells.push(cur);}else cur.push(it.str);prev=it;}
    rows.push(cells.map(c=>{const s=c.join(rtl?' ':' ').replace(/\s+/g,' ').trim();const n=toLatin(s).replace(/٫/g,'.').replace(/[٬,]/g,'');return /^-?\d+(\.\d+)?$/.test(n)&&n.length<16?+n:s;}));}
  return rows;}
async function exportXlsx(){
  showBusy('جارٍ التحويل إلى Excel…');
  try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};let any=false;const n=Math.min(S.pages.length,200);
    for(let i=0;i<n;i++){const p=S.pages[i],d=dims(p);let rows=[];const items=p.ocr?[]:await pageItems(p);
      if(items.length)rows=itemsToRows(items,d.w/d.h);else{const t=await pageText(p);rows=t.trim()?t.split('\n').map(l=>[l]):[];}
      if(rows.length)any=true;
      const ws=XLSX.utils.aoa_to_sheet(rows.length?rows:[['']]);const cols=[];rows.forEach(r=>r.forEach((c,j)=>{cols[j]=Math.max(cols[j]||8,Math.min(60,String(c).length+2));}));ws['!cols']=cols.map(w=>({wch:w}));
      XLSX.utils.book_append_sheet(wb,ws,'صفحة '+(i+1));setBusy((i+1)/n);}
    hideBusy();if(!any){toast('لم يُعثر على نص. استخدم «التعرّف الضوئي» أولاً للصفحات المصوّرة',4200);return;}

  catch(e){console.error(e);hideBusy();toast('تعذّر التحويل إلى Excel. تحقق من الاتصال ثم أعد المحاولة',3800);}
}

const PDFENC=(()=>{

  async function hash2B(password,salt,udata){

  function pValue({print=true,copy=false,modify=false,annotate=false}={}){
    let p=0xFFFFF0C0; // reserved bits set, bits 1-2 zero

  }

        let cur='',lastY=null;const lines=[];for(const it of tc.items){if(!('str' in it))continue;const y=Math.round(it.transform[5]);if(lastY!==null&&Math.abs(y-lastY)>3&&cur){lines.push(cur);cur='';}cur+=it.str.normalize('NFKC');lastY=y;}if(cur)lines.push(cur);t=lines.map(l=>fixVisualAr(l.replace(/\s+/g,' ').trim())).join('\n');}catch(e){}}

async function ghPush(key,salt,remote,onProgress){

  const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes));

  const w=await gh(GH_DIR+'/manifest.json',{method:'PUT',body:{message:'صفحات: مزامنة',content:u8b64(new TextEncoder().encode(JSON.stringify(doc))),...(sha?{sha}:{})}});

    const px=Math.max(0,Math.floor(b.x*W)-8),py=Math.max(0,Math.floor(b.y*H)-8),pw=Math.min(W-px,Math.ceil(b.w*W)+16),ph=Math.min(H-py,Math.ceil(b.h*H)+16);
    showBusy('جارٍ التقاط المقطع…');const blob=await regionShot(p,b,true);
    const url=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(blob);});
    const key=await addImg(url);hideBusy();
    const a={type:'image',key,pts:[[px/W,py/H]],w:pw/W,h:ph/H};
    pushUndo(cut?'قص المقطع':'نسخ المقطع');
    if(cut)p.annots.push({type:'whiteout',pts:[[b.x,b.y],[b.x+b.w,b.y+b.h]]});
    p.annots.push(a);CLIP={img:url,box:{...b},ratio:pageRatio(p)};markDirty();clearMsel();LIFT.a=a;LIFT.t=Date.now();selectItems(m.id,[a]);setTimeout(()=>{if(LIFT.a===a)drawOverlay(m.id);},1450);
    toast(cut?'قُصّ المقطع':'نُسخ المقطع',1400);
  }catch(e){console.error(e);hideBusy();toast('تعذّر التقاط المقطع');}}
async function copyRegionImage(m){try{const p=byId(m.id),blob=await regionShot(p,m.box,true);const url=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(blob);});

async function finishLasso(id,poly,tap){
  const p=byId(id);if(!p)return;const r=pageRatio(p);let items=[];
  if(tap){const a=hit(p,tap);if(a)items=[a];else{clearMsel();return;}}
  else if(rectPoly(poly)){const xs=poly.map(q=>q[0]),ys=poly.map(q=>q[1]),R={x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)};
    items=p.annots.filter(a=>{if(['link','note'].includes(a.type))return false;const b=bbox(a,r);return b.x<R.x1&&b.x+b.w>R.x0&&b.y<R.y1&&b.y+b.h>R.y0&&(itemInPoly(a,poly,r)||touchesRect(a,R,r));});
    if(items.length){S.msel={id,items,box:{x:R.x0,y:R.y0,w:R.x1-R.x0,h:R.y1-R.y0},poly,region:true,rect:true,text:'',runs:[]};drawOverlay(id);renderSelbar();return;}}
  else items=p.annots.filter(a=>itemInPoly(a,poly,r));
  let box;
  if(items.length)box=unionBox(items,r);
  else{const xs=poly.map(q=>q[0]),ys=poly.map(q=>q[1]);box={x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};
    if(box.w<.015||box.h<.008){clearMsel();return;}}
  const prev=S.msel&&S.msel.id;S.msel={id,items,box,poly,region:!items.length,text:'',runs:[]};if(prev&&prev!==id)drawOverlay(prev);
  drawOverlay(id);renderSelbar();
  if(!items.length&&p.src.kind==='pdf'){
    const its=(await pageRuns(p)).flatMap(l=>l.parts).filter(it=>{const cx=(it.x0+it.x1)/2,cy=(it.y0+it.y1)/2;return cx>box.x&&cx<box.x+box.w&&cy>box.y&&cy<box.y+box.h&&inPoly([cx,cy],poly);});
    if(S.msel&&S.msel.id===id&&S.msel.poly===poly){S.msel.runs=its;S.msel.text=runsText(its);drawOverlay(id);renderSelbar();}}
}
function drawMsel(x,p,W,H){

  for(const a of m.items){const q=bbox(a,r);x.strokeStyle='rgba(36,89,214,.5)';x.lineWidth=DPR;x.strokeRect(q.x*W,q.y*H,q.w*W,q.h*H);}
  if(m.runs&&m.runs.length){x.fillStyle='rgba(36,89,214,.2)';for(const it of m.runs)x.fillRect(it.x0*W,it.y0*H,(it.x1-it.x0)*W,(it.y1-it.y0)*H);}

  x.fillStyle='rgba(36,89,214,.06)';x.strokeStyle='#2459d6';x.lineWidth=1.6*DPR;x.setLineDash([7*DPR,5*DPR]);
  x.fillRect(b.x*W-pad,b.y*H-pad,b.w*W+pad*2,b.h*H+pad*2);x.strokeRect(b.x*W-pad,b.y*H-pad,b.w*W+pad*2,b.h*H+pad*2);
  if(m.items.length===1&&VTX_TYPES.includes(m.items[0].type)&&S.tool==='lasso'){const v=views.get(p.id),k=W/v.cssW,a=m.items[0];x.setLineDash([]);
    for(const q of midHandles(a,r)){x.fillStyle='#fff';x.strokeStyle='#64748b';x.lineWidth=1.4*k;x.beginPath();x.arc(q[0]*W,q[1]*H,6*k,0,Math.PI*2);x.fill();x.stroke();}
    parHandles(a,r).forEach((q,i)=>{x.fillStyle='#fff';x.strokeStyle='#2563eb';x.lineWidth=1.4*k;x.beginPath();x.rect(q[0]*W-5*k,q[1]*H-5*k,10*k,10*k);x.fill();x.stroke();if(((a.pars||[])[i]|0)>0){x.fillStyle='#2563eb';x.fillRect(q[0]*W-2.4*k,q[1]*H-2.4*k,4.8*k,4.8*k);}});
    if(a.type==='poly')for(const h of xHandles(a,v)){x.fillStyle='#fff';x.strokeStyle='#0f8a74';x.lineWidth=1.6*k;x.beginPath();x.arc(h.q[0]*W,h.q[1]*H,7*k,0,Math.PI*2);x.fill();x.stroke();const n=((a.xang||{})[h.key]||[])[h.s]|0;if(n){x.fillStyle='#0f8a74';x.beginPath();x.arc(h.q[0]*W,h.q[1]*H,3.2*k,0,Math.PI*2);x.fill();}}
    for(const q of vtxHandles(a,r)){x.fillStyle='#f59e0b';x.strokeStyle='#fff';x.lineWidth=2*k;x.beginPath();x.arc(q[0]*W,q[1]*H,8*k,0,Math.PI*2);x.fill();x.stroke();}}
  else{const v=views.get(p.id);if(v&&S.tool==='lasso'&&canResize(m)){const k=W/v.cssW;x.setLineDash([]);x.fillStyle='#fff';x.strokeStyle='#2459d6';x.lineWidth=1.6*k;
    for(const [hx,hy] of resHandles(m,v)){const s=9*k;x.fillRect(hx*k-s/2,hy*k-s/2,s,s);x.strokeRect(hx*k-s/2,hy*k-s/2,s,s);}}}
  const v=views.get(p.id);if(m.items.length&&m.items.some(canRot)&&v&&S.tool==='lasso'){const k=W/v.cssW,hp=rotHandle(m,v);if(hp){const hx=hp[0]*k,hy=hp[1]*k,edge=hy<b.y*H?b.y*H-pad:(b.y+b.h)*H+pad;

function drawLasso(x,pts,W,H){if(pts.length<2)return;x.save();x.strokeStyle='#2459d6';x.lineWidth=2*DPR;x.setLineDash([6*DPR,4*DPR]);x.fillStyle='rgba(36,89,214,.07)';

function positionSelbar(){
  const m=S.msel,sb=$('#selbar');if(!m||sb.hidden)return;const v=views.get(m.id);
  if(!v||viewer.hidden){sb.style.visibility='hidden';return;}
  const r=v.o.getBoundingClientRect(),b=m.box,top=r.top+b.y*r.height,bot=r.top+(b.y+b.h)*r.height,cx=r.left+(b.x+b.w/2)*r.width,vr=viewer.getBoundingClientRect();
  if(bot<vr.top||top>vr.bottom){sb.style.visibility='hidden';return;}sb.style.visibility='visible';
  const h=sb.offsetHeight,w=sb.offsetWidth,ex=S.tool==='lasso'&&m.items&&m.items.some(canRot)?46:0;let y=top-h-16-ex;if(y<vr.top+6)y=Math.min(bot+16,vr.bottom-h-6);
  sb.style.top=Math.max(vr.top+4,y)+'px';sb.style.left=Math.max(8,Math.min(window.innerWidth-w-8,cx-w/2))+'px';

/* ---------- math typesetting: a LaTeX subset drawn on canvas, Arabic right-to-left aware ---------- */
const MCMD={times:'×',div:'÷',pm:'±',mp:'∓',cdot:'·',le:'≤',leq:'≤',ge:'≥',geq:'≥',ne:'≠',neq:'≠',approx:'≈',equiv:'≡',pi:'π',infty:'∞',degree:'°',circ:'°',angle:'∠',

const MOPS='+−=<>≤≥≠≈±∓×÷·≡→⇒∈∉⊂∪∩';

function mParse(src){

  const group=()=>{while(s[i]===' ')i++;if(s[i]==='{'){i++;const r=row('}');i++;return r;}return atom()||{t:'row',c:[]};};
  function atom(){
    while(s[i]===' ')i++;const ch=s[i];if(ch==null)return null;
    if(ch==='{'){i++;const r=row('}');i++;return r;}
    if(ch==='\\'){const n=cmd();
      if(n==='frac'||n==='dfrac'||n==='tfrac'){const a=group(),b=group();return {t:'frac',n:a,d:b};}
      if(n==='sqrt'){let idx=null;while(s[i]===' ')i++;if(s[i]==='['){i++;idx=row(']');i++;}return {t:'sqrt',c:group(),idx};}
      if(['text','mathrm','textrm','mbox','textbf'].includes(n)){while(s[i]===' ')i++;let v='';if(s[i]==='{'){i++;let dep=1;while(i<s.length){if(s[i]==='{')dep++;else if(s[i]==='}'&&!--dep)break;v+=s[i++];}i++;}return {t:'txt',v};}

      if(ch==='^'||ch==='_'){i++;const arg=group();const base=c.pop()||{t:'row',c:[]};
        if(base.t==='script'&&!base[ch==='^'?'sup':'sub']){base[ch==='^'?'sup':'sub']=arg;c.push(base);}
        else c.push(ch==='^'?{t:'script',b:base,sup:arg}:{t:'script',b:base,sub:arg});continue;}

      if(pv&&pv.t==='sym'&&a.t==='sym'&&((NUM.test(pv.v)&&NUM.test(a.v))||(!gap&&ARL.test(pv.v)&&ARL.test(a.v))))pv.v+=a.v;else c.push(a);

function mSym(v,rtl){if(rtl){v=v.replace(/[0-9]/g,d=>AR[d]).replace(/\./g,'٫').replace(/,/g,'،');if(MMIRROR[v])v=MMIRROR[v];}return v;}

  const none={w:0,a:fs*.5,d:0,draw(){}};if(!n)return none;

    case 'row':{const bs=n.c.map(k=>mLayout(k,fs,x,rtl));let w=0,a=fs*.5,d=0;for(const b of bs){w+=b.w;a=Math.max(a,b.a);d=Math.max(d,b.d);}

        const bx=rtl?X+sw+g:X,sx=rtl?X:X+b.w+g;b.draw(bx,Y);   // Arabic: the exponent sits to the left of its base

      const sw=fs*.6,g=fs*.12,rule=Math.max(1,fs*.06),top=c.a+g+rule,w=sw+c.w+fs*.14,extra=ib?Math.max(0,ib.w-sw*.45):0;

        if(ib)ib.draw(rtl?L+w-sw*.55:L+sw*.55-ib.w,Y-fs*.42);}};}

}
function mathLayout(tex,fs,ctx,rtl){return mLayout(mParse(tex),fs,ctx,rtl);}

/* ---------- handwriting recognition: plain text or formatted math ---------- */
/* =====================================================================
   ON-DEVICE HANDWRITTEN MATH RECOGNITION (no internet, no AI)

const INKM=(()=>{

    if(L<1e-9)return Array.from({length:n},()=>({x:pts[0].x,y:pts[0].y,id:0}));

document.addEventListener('keydown',e=>{
  if(!scrim.hidden||/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))return;
  const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(mod&&k==='v'&&CLIP&&inViewer()&&$('#lib').hidden){e.preventDefault();pasteClip(S.msel&&S.msel.region?S.msel:null);return;}
  const m=S.msel;if(!m)return;
  if((e.key==='Delete'||e.key==='Backspace')&&m.items.length){e.preventDefault();selAction('del');}
  else if(mod&&k==='c'){e.preventDefault();selAction(m.items.length?'copy':'copytext');}
  else if(mod&&k==='d'&&m.items.length){e.preventDefault();selAction('dup');}
  else if(e.key==='Escape')clearMsel();
});

const langTextState=new WeakMap(),langAttrState=new WeakMap();let appLanguage='ar',langApplying=false;try{appLanguage=localStorage.getItem('safahat-language')==='en'?'en':'ar';}catch(e){}
function langTranslate(s){const raw=String(s),trim=raw.trim();if(EN_UI[trim])return raw.replace(trim,EN_UI[trim]);let m=trim.match(/^صفحة\s+(.+?)\s+من\s+(.+)$/);if(m)return raw.replace(trim,`Page ${m[1]} of ${m[2]}`);m=trim.match(/^حُذف\s+(.+)$/);if(m)return raw.replace(trim,`Deleted ${m[1]}`);m=trim.match(/^نُسخ\s+(.+)$/);if(m)return raw.replace(trim,`Copied ${m[1]}`);m=trim.match(/^ترجمة المحدد إلى\s*(.*)$/);if(m)return raw.replace(trim,`Translate selection to ${m[1]}`);m=trim.match(/^ترجمة الصفحة الحالية إلى\s*(.*)$/);if(m)return raw.replace(trim,`Translate current page to ${m[1]}`);return raw;}

const LANG_ATTRS=['title','aria-label','placeholder','alt'];function langElement(el){if(!el||el.nodeType!==1||el.closest('#viewer,[contenteditable="true"],.pdf-text,.user-content'))return;for(const a of LANG_ATTRS){if(!el.hasAttribute(a))continue;let r=langAttrState.get(el)||{};if(!r[a]||el.getAttribute(a)!==r[a].translated)r[a]={original:el.getAttribute(a),translated:null};const q=r[a];if(appLanguage==='en'){const t=langTranslate(q.original);if(t!==el.getAttribute(a))el.setAttribute(a,t);q.translated=t;}else if(q.translated!==null&&el.getAttribute(a)===q.translated){el.setAttribute(a,q.original);q.translated=null;}langAttrState.set(el,r);}}
