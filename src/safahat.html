<title>صفحات PDF</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Readex+Pro:wght@500;600;700&family=Reem+Kufi:wght@600;700&display=swap">
<style>
/* Layout: desktop-app shell — dark chrome (brand, document, actions, mode tabs), a light ribbon of grouped tools,
   a property strip, then the workspace: thumbnail rail + dotted desk holding the pages, and a slim status bar. RTL. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --raise:#f7f9f8; --ink:#132024; --muted:#5b6b6e; --line:#dfe6e4; --line-strong:#c8d2d0;
  --accent:#0f8a74; --accent-strong:#0b6e5f; --accent-ink:#ffffff; --accent-soft:#e1f3ee;
  --chrome:#0f1b1e; --chrome-2:#16262a; --chrome-ink:#eaf2f0; --chrome-muted:#8ea3a2; --chrome-line:#24363b;
  --desk:#e6ebe9; --dot:rgba(15,27,30,.075); --mark:#ffd84d; --danger:#c0362c; --danger-soft:#fdeceb;
  --blue:#2459d6; --blue-soft:#e7eefd; --amber:#a95a06; --amber-soft:#fcf0de; --violet:#6a46d6; --violet-soft:#eee9fc;
  --shadow-sm:0 1px 2px rgba(12,28,30,.08);
  --shadow:0 1px 2px rgba(12,28,30,.10),0 10px 28px -8px rgba(12,28,30,.22);
  --shadow-lg:0 24px 60px -18px rgba(8,20,22,.45);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1315; --surface:#141e21; --raise:#10181b; --ink:#e4edeb; --muted:#93a6a8; --line:#223135; --line-strong:#2f4348;
  --accent:#34c4a7; --accent-strong:#34c4a7; --accent-ink:#04201a; --accent-soft:#12322c;
  --chrome:#081012; --chrome-2:#0f1a1d; --chrome-ink:#e4edeb; --chrome-muted:#7d9395; --chrome-line:#1a2a2e;
  --desk:#090f11; --dot:rgba(255,255,255,.05); --mark:#ffd84d; --danger:#f2766b; --danger-soft:#3a1714;
  --blue:#82a6ff; --blue-soft:#17223b; --amber:#efb35b; --amber-soft:#30240f; --violet:#b39dff; --violet-soft:#221b3b;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5); --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 30px -8px rgba(0,0,0,.6); --shadow-lg:0 24px 60px -18px rgba(0,0,0,.8);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1315; --surface:#141e21; --raise:#10181b; --ink:#e4edeb; --muted:#93a6a8; --line:#223135; --line-strong:#2f4348;
  --accent:#34c4a7; --accent-strong:#34c4a7; --accent-ink:#04201a; --accent-soft:#12322c;
  --chrome:#081012; --chrome-2:#0f1a1d; --chrome-ink:#e4edeb; --chrome-muted:#7d9395; --chrome-line:#1a2a2e;
  --desk:#090f11; --dot:rgba(255,255,255,.05); --mark:#ffd84d; --danger:#f2766b; --danger-soft:#3a1714;
  --blue:#82a6ff; --blue-soft:#17223b; --amber:#efb35b; --amber-soft:#30240f; --violet:#b39dff; --violet-soft:#221b3b;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5); --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 30px -8px rgba(0,0,0,.6); --shadow-lg:0 24px 60px -18px rgba(0,0,0,.8);
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--chrome)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{height:100%;display:flex;flex-direction:column}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---- chrome ---- */
.chrome{background:var(--chrome);color:var(--chrome-ink);flex:none}
.bar1{display:flex;align-items:center;gap:10px;padding-block:10px 8px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:0;flex:none}
.brand .mk{width:26px;height:30px;position:relative;flex:none}
.brand .mk i{position:absolute;inset:0;background:var(--accent);border-radius:4px;clip-path:polygon(0 0,64% 0,100% 28%,100% 100%,0 100%)}
.brand .mk i::after{content:"";position:absolute;top:0;left:64%;width:36%;height:28%;background:#bff0e4;opacity:.9}
.brand .mk b{position:absolute;right:5px;left:5px;bottom:8px;height:4px;border-radius:2px;background:var(--mark)}
.brand .mk b::before{content:"";position:absolute;right:0;width:65%;top:-7px;height:2px;border-radius:2px;background:rgba(255,255,255,.75)}
.doc{flex:4 1 auto;min-width:0;display:flex;align-items:center;gap:10px;background:var(--chrome-2);border:1px solid var(--chrome-line);border-radius:10px;padding:6px 10px;text-align:right;color:var(--chrome-ink);max-width:460px}
.doc:hover{border-color:var(--chrome-muted)}
.doc .di{width:28px;height:28px;border-radius:7px;background:rgba(52,196,167,.14);color:var(--accent);display:grid;place-items:center;flex:none}
.doc .di svg.i{width:17px;height:17px}
.doc .dt{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.doc .dt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.doc .dt small{color:var(--chrome-muted);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.doc .dirty{display:inline-flex;align-items:center;gap:5px;color:var(--mark);font-size:11.5px;margin-inline-start:auto;white-space:nowrap;flex:none}
.doc .dirty::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mark)}
.doc .dirty[hidden]{display:none!important}
.sp{flex:1}
.cbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--chrome-line);background:transparent;color:var(--chrome-ink);border-radius:10px;padding:8px 12px;font-weight:500;flex:none}
.cbtn:hover:not(:disabled){background:var(--chrome-2);border-color:var(--chrome-muted)}
.cbtn.icon{padding:8px}
.cbtn:disabled{opacity:.35;cursor:default}
.cbtn.primary{background:var(--accent);border-color:var(--accent);color:#04201a;font-weight:700}
.cbtn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.cgroup{display:flex;gap:2px;border:1px solid var(--chrome-line);border-radius:10px;padding:2px}
.cgroup .cbtn{border:0;padding:6px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:0 0}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:9px 14px 11px;font-weight:500;color:var(--chrome-muted);white-space:nowrap;border-radius:10px 10px 0 0;position:relative}
.tab svg.i{width:17px;height:17px}
.tab:hover{color:var(--chrome-ink)}
.tab[aria-selected="true"]{color:var(--ink);background:var(--surface)}
.tab[aria-selected="true"] svg.i{color:var(--accent)}

/* ---- ribbon ---- */
.ribbon{background:var(--surface);border-bottom:1px solid var(--line);flex:none;position:relative;z-index:3}
.toolbar{display:flex;align-items:stretch;gap:2px;overflow-x:auto;padding-block:6px 4px;scrollbar-width:thin}
.toolbar[hidden]{display:none!important}
.tg{display:flex;flex-direction:column;align-items:stretch;flex:none;padding-inline:6px;border-inline-start:1px solid var(--line)}
.tg:first-child{border-inline-start:0;padding-inline-start:0}
.tgi{display:flex;align-items:center;gap:2px;flex:1}
.tgl{font-size:10.5px;color:var(--muted);text-align:center;letter-spacing:.02em;padding-top:2px;white-space:nowrap}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:52px;padding:6px 6px 5px;border-radius:9px;border:1px solid transparent;background:none;font-size:11.5px;color:var(--ink);flex:none;position:relative;transition:background .12s,color .12s}
.tb:hover:not(:disabled){background:var(--raise);border-color:var(--line)}
.tb.on{background:var(--accent-soft);color:var(--accent-strong);border-color:color-mix(in srgb,var(--accent) 45%,transparent);font-weight:700}
.tb:disabled{opacity:.35;cursor:default}
.tb .cd{position:absolute;top:5px;left:9px;width:9px;height:9px;border-radius:50%;background:var(--c,transparent);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line-strong)}
.zoomval{min-width:54px;align-self:center;text-align:center;font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:5px 0}

/* ---- property strip ---- */
.props{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px;background:var(--raise);border-bottom:1px solid var(--line);flex:none;position:relative;z-index:2}
.props[hidden]{display:none!important}
.pv{width:104px;height:46px;border-radius:10px;background:#fff;border:1px solid var(--line);flex:none;display:block;box-shadow:var(--shadow-sm)}
.pgroup{display:flex;flex-direction:column;gap:6px;min-width:0}
.plabel{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.03em}
.swatches{display:flex;flex-wrap:wrap;gap:7px}
.sw{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--surface);box-shadow:0 0 0 1px var(--line-strong);flex:none;padding:0;position:relative;transition:transform .12s}
.sw:hover{transform:scale(1.08)}
.sw.on{box-shadow:0 0 0 2.5px var(--ink)}
.favg .favs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fav{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--muted)}
.fav.on{box-shadow:0 0 0 2px var(--accent);border-color:var(--accent)}.fav.star{border-style:dashed}.fav.star.on{color:#d4a017;border-style:solid;box-shadow:none}.fav.star svg{width:18px;height:18px}
.fvd{display:block;width:var(--d);height:var(--d);border-radius:50%;background:var(--c)}.fvd.mk{border-radius:3px;width:calc(var(--d) + 6px);opacity:var(--o)}
.fvs svg{width:18px;height:18px}
.rd-fav{width:30px;height:30px}
.mscale{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.mscale input{width:84px;padding:7px 8px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit;text-align:center}
.tb.favtb .fvd,.tb.favtb .fvs{margin:2px auto}
.sw.same{background:var(--bg);color:var(--ink);font:700 15px/1 system-ui;display:grid;place-items:center}
.sw.on::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--surface);opacity:.92}
.sw.hl{border-radius:7px;width:34px;height:24px}
.sw.hl.on::after{inset:6px 10px;border-radius:3px}
.custom{width:28px;height:28px;border-radius:50%;flex:none;position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--line-strong);background:conic-gradient(#f44,#fd4,#4d6,#4cf,#46f,#c4f,#f44)}
.custom input{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);opacity:0;cursor:pointer;border:0;padding:0}
.custom.on{box-shadow:0 0 0 2.5px var(--ink)}
.slider{display:flex;align-items:center;gap:8px}
.slider input[type=range]{width:150px;accent-color:var(--accent)}
.slider output{min-width:46px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px}
.toggle.on{border-color:var(--accent);color:var(--accent-strong);background:var(--accent-soft);font-weight:700}
.toggle svg.i{width:16px;height:16px}

/* ---- workspace ---- */
main{flex:1;min-height:0;display:flex;position:relative}
.rail{width:172px;flex:none;background:var(--surface);border-inline-end:1px solid var(--line);overflow:auto;padding:14px 12px;display:none;flex-direction:column;gap:14px}
.rail.show{display:flex}
@media (max-width:1023px){.rail.show{display:none}}
.rail h4{margin:0;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.rt{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.rt .rc{width:100%;display:grid;place-items:center;padding:6px;border-radius:9px;border:2px solid transparent;transition:border-color .12s,background .12s}
.rt canvas{max-width:100%;background:#fff;box-shadow:var(--shadow-sm);border-radius:2px;display:block}
.rt:hover .rc{background:var(--raise)}
.rt.on .rc{border-color:var(--accent);background:var(--accent-soft)}
.rt.on{color:var(--accent-strong);font-weight:700}
.stage{flex:1;min-width:0;position:relative}
.viewer{position:absolute;inset:0;overflow:auto;background-color:var(--desk);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:18px 18px;display:flex;flex-direction:column;align-items:center;gap:40px;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{position:relative;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 2px 4px rgba(0,0,0,.06),0 16px 36px -14px rgba(10,24,26,.35);flex:none;border-radius:3px}
.page canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:3px}
.page .ov{pointer-events:none}
.viewer.draw .ov{pointer-events:auto;touch-action:none;cursor:crosshair}
.viewer.tap .ov{pointer-events:auto;touch-action:pan-x pan-y;cursor:copy}
.viewer.mv .ov{cursor:grab}
.viewer.sepia .pc{filter:sepia(.55) saturate(1.1) brightness(.97)}
.viewer.night .pc{filter:invert(.9) hue-rotate(180deg) brightness(1.05)}
.pnum{position:absolute;bottom:-29px;left:50%;transform:translateX(-50%);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 10px;box-shadow:var(--shadow-sm);white-space:nowrap}
.panel{position:absolute;inset:0;overflow:auto;padding-block:26px 40px;background:var(--bg)}
.panel[hidden],.viewer[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto}

/* ---- status ---- */
.status{display:flex;align-items:center;gap:10px;padding-block:6px;background:var(--surface);border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.status .nav{display:flex;align-items:center;gap:6px}
.status .nb{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:30px;height:30px;display:grid;place-items:center;color:var(--ink)}
.status .nb:hover{border-color:var(--accent);color:var(--accent)}
.status .nb svg.i{width:16px;height:16px}
.status input{width:48px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--raise);padding:5px 4px;font-weight:700;color:var(--ink)}
.status .sp{flex:1}
.status .meta{display:flex;align-items:center;gap:6px}
.status .meta svg.i{width:15px;height:15px;color:var(--accent)}

/* ---- headings ---- */
.hint{color:var(--muted);font-size:13.5px;line-height:1.7;margin:0 0 16px;max-width:68ch}
h2.sec{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0 0 6px;text-wrap:balance;letter-spacing:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--accent-strong);margin:0 0 6px}

/* ---- page grid ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:9px;position:relative;box-shadow:var(--shadow-sm);transition:border-color .12s,box-shadow .12s}
.card:hover{border-color:var(--line-strong)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.thumb{background:var(--desk);border-radius:9px;display:grid;place-items:center;aspect-ratio:3/4;overflow:hidden;cursor:pointer;border:0;padding:10px;width:100%}
.thumb canvas{max-width:100%;max-height:100%;box-shadow:0 1px 3px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.25);background:#fff;border-radius:2px}
.chead{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.chead input{width:18px;height:18px;accent-color:var(--accent)}
.cact{display:flex;justify-content:space-between;gap:2px;border-top:1px solid var(--line);padding-top:6px}
.mini{border:0;background:none;padding:6px;border-radius:8px;color:var(--muted)}
.mini:hover{background:var(--accent-soft);color:var(--accent-strong)}
.mini[data-a="del"]:hover{background:var(--danger-soft);color:var(--danger)}
.mini svg.i{width:17px;height:17px}

/* ---- tools ---- */
.hero{display:flex;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow-sm);margin-bottom:8px}
.hero .ht{width:92px;flex:none;background:var(--desk);border-radius:10px;padding:8px;display:grid;place-items:center}
.hero .ht canvas{max-width:100%;background:#fff;box-shadow:var(--shadow-sm);border-radius:2px;display:block}
.hero .hb{min-width:0;flex:1}
.hero h2.sec{overflow-wrap:anywhere}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.hero .ha{display:flex;flex-direction:column;gap:8px;flex:none}
@media (max-width:640px){.hero{flex-wrap:wrap}.hero .ha{flex-direction:row;width:100%}.hero .ha .hbtn{flex:1;justify-content:center}}
.group{margin:28px 0 12px;font-size:12px;letter-spacing:.05em;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:10px}
.group::after{content:"";flex:1;height:1px;background:var(--line)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tool{display:flex;gap:13px;align-items:flex-start;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0;box-shadow:var(--shadow-sm);transition:border-color .12s,transform .12s,box-shadow .12s}
.tool:hover{border-color:var(--line-strong);transform:translateY(-1px);box-shadow:var(--shadow)}
.tool .ic{width:42px;height:42px;border-radius:12px;background:var(--tc-soft,var(--accent-soft));color:var(--tc,var(--accent-strong));display:grid;place-items:center;flex:none}
.tool b{display:block;font-size:15px;margin-bottom:3px;font-weight:700}
.tool small{color:var(--muted);font-size:12.5px;line-height:1.55;display:block}
.cat-org{--tc:var(--accent-strong);--tc-soft:var(--accent-soft)}
.cat-conv{--tc:var(--blue);--tc-soft:var(--blue-soft)}
.cat-prot{--tc:var(--amber);--tc-soft:var(--amber-soft)}
.cat-rev{--tc:var(--violet);--tc-soft:var(--violet-soft)}
.cat-scan{--tc:var(--danger);--tc-soft:var(--danger-soft)}

/* ---- buttons (light surfaces) ---- */
.hbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500;color:var(--ink)}
.hbtn:hover:not(:disabled){border-color:var(--accent);color:var(--accent-strong)}
.hbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.hbtn.primary:hover:not(:disabled){filter:brightness(1.06);color:var(--accent-ink)}
.hbtn.icon{padding:9px}
.hbtn:disabled{opacity:.4;cursor:default}
.hbtn svg.i{width:18px;height:18px}

/* ---- ai ---- */
.aibox{display:grid;gap:16px;max-width:780px;margin:0 auto}
.aihead{display:flex;gap:14px;align-items:flex-start}
.aihead .ic{width:46px;height:46px;border-radius:14px;background:var(--violet-soft);color:var(--violet);display:grid;place-items:center;flex:none}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.chip{display:flex;align-items:center;gap:10px;text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-weight:500;box-shadow:var(--shadow-sm)}
.chip svg.i{color:var(--violet);width:18px;height:18px}
.chip:hover{border-color:var(--violet)}
.ask{display:flex;gap:8px;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;padding:6px;box-shadow:var(--shadow-sm)}
.ask:focus-within{border-color:var(--accent)}

.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}

.crpv[hidden]{display:none}.crpv.min canvas{display:none}.crpv.min{padding:6px 10px}.crpv.fade{opacity:.18;pointer-events:none}.crpv canvas{max-width:min(150px,26vw);max-height:min(200px,30vh);border-radius:6px;background:#fff;display:block}.crpv span{font-size:11.5px;color:#cfe3de}

.tchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}

.crop .row .sp{flex:1}

/* ---- layouts, presentation ---- */

/* ---------- undo ---------- */
function snap(){return JSON.stringify({pages:S.pages,settings:S.settings});}
function undoLabel(){const t=TOOL_INFO&&TOOL_INFO[S.tool]?TOOL_INFO[S.tool][1]:'تعديل';return (S.tab==='pages'?'تعديل الصفحات':t)+(S.pages.length>1?'، صفحة '+ar((S.cur||0)+1):'');}
let undoBytes=0;
function pushUndo(label){const e={s:snap(),t:Date.now(),label:label||undoLabel()};S.undo.push(e);
  // keep up to 200 steps, but never more than ~40 MB of history
  let tot=S.undo.reduce((a,x)=>a+(x.s||x).length,0);while(S.undo.length>200||(tot>4e7&&S.undo.length>5)){tot-=(S.undo[0].s||S.undo[0]).length;S.undo.shift();}
  S.redo=[];updUndo();}
function restore(str){if(str&&typeof str==='object')str=str.s;const before=S.pages.map(p=>p.id+p.rot+(p.filter||'')).join();const o=JSON.parse(str);S.pages=o.pages;S.settings=o.settings;S.sel=null;S.msel=null;$('#selbar').hidden=true;
  const after=S.pages.map(p=>p.id+p.rot+(p.filter||'')).join();if(before!==after)refreshAll();else redrawAll();markDirty();updUndo();updSelBtns();}
function doUndo(){if(!S.undo.length)return;const e=S.undo.pop();S.redo.push({s:snap(),t:Date.now(),label:e.label||'تعديل'});restore(e);}
function doRedo(){if(!S.redo.length)return;const e=S.redo.pop();S.undo.push({s:snap(),t:Date.now(),label:e.label||'تعديل'});restore(e);}
function historySheet(){
  const steps=S.undo.slice().reverse(),redo=S.redo.slice().reverse();const tm=t=>{const d=new Date(t);let h=d.getHours();const m=d.getMinutes();const ap=h<12?'ص':'م';h=h%12||12;return ar(h)+':'+ar(String(m).padStart(2,'0'))+' '+ap;};
  const vers=(S.versions||[]).slice().reverse();
  openSheet(`<h3>${ic('undo')} سجل التعديلات</h3>
    <p class="hint" style="margin:0">اضغط على أي خطوة للرجوع إليها مباشرة. يحتفظ السجل بآخر ٢٠٠ خطوة في هذه الجلسة، والنسخ السابقة أدناه محفوظة مع الملف دائماً.</p>
    <div class="hist">${redo.length?redo.map((e,i)=>`<button data-hr="${redo.length-i}" class="fut"><span>${ic('redo')}</span><b>${esc(e.label||'تعديل')}</b><small>إعادة</small></button>`).join(''):''}
      <div class="now"><span>${ic('check')}</span><b>الحالة الحالية</b><small>${tm(Date.now())}</small></div>
      ${steps.length?steps.map((e,i)=>`<button data-hu="${i+1}"><span>${ic('undo')}</span><b>${esc(e.label||'تعديل')}</b><small>${e.t?tm(e.t):''}</small></button>`).join(''):'<p class="hint">لا توجد خطوات بعد في هذه الجلسة.</p>'}</div>
    <p class="subh" style="margin-top:4px">${ic('clock')} النسخ السابقة من الملف</p>
    <div class="hist">${vers.length?vers.map((v,i)=>`<button data-hv="${vers.length-1-i}"><span>${ic('file')}</span><b>${fmtWhen(v.t)}</b><small>${cnt(v.n||0,'page')}، ${ar(v.a||0)} تعليق</small></button>`).join(''):'<p class="hint">تُحفظ نسخة تلقائياً كل ١٥ دقيقة من العمل على الملف.</p>'}</div>
    <div class="acts"><button class="hbtn primary" data-close>تم</button></div>`);
  wireClose();
  sheet.querySelectorAll('[data-hu]').forEach(b=>b.onclick=()=>{let k=+b.dataset.hu;while(k-->0)doUndo();closeSheet();markDirty();toast('رجعتَ إلى: '+b.querySelector('b').textContent,2200);});
  sheet.querySelectorAll('[data-hr]').forEach(b=>b.onclick=()=>{let k=+b.dataset.hr;while(k-->0)doRedo();closeSheet();markDirty();});
  sheet.querySelectorAll('[data-hv]').forEach(b=>b.onclick=()=>{const v=S.versions[+b.dataset.hv];if(!v)return;closeSheet();
    confirmSheet('استعادة هذه النسخة؟','ستعود الصفحات والتعليقات إلى حالتها في '+fmtWhen(v.t)+'. يمكنك التراجع بعدها.','استعادة',()=>{pushUndo('استعادة نسخة '+fmtWhen(v.t));restore(v.s);markDirty();toast('استُعيدت النسخة');});});
}

/* ---------- loading documents ---------- */
async function pdfFromBytes(bytes,password){
  return await pdfjs.getDocument({data:bytes.slice(),password,isEvalSupported:false,disableFontFace:false,...(window.SAFAHAT_NATIVE?{cMapUrl:'lib/cmaps/',cMapPacked:true,standardFontDataUrl:'lib/standard_fonts/'}:{})}).promise;
}
async function addPdf(buf,name){
  const bytes=new Uint8Array(buf);let pdf,encrypted=false;
  try{pdf=await pdfFromBytes(bytes);}
  catch(e){
    if(e&&e.name==='PasswordException'){
      let pw=await askPassword(name,false);
      while(pw!==null){try{pdf=await pdfFromBytes(bytes,pw);encrypted=true;break;}catch(e2){pw=await askPassword(name,true);}}
      if(!pdf)return [];
    }else{toast('تعذّر فتح الملف: '+name,4000);return [];}
  }
  const idx=S.sources.push({name,bytes,pdf,encrypted})-1;
  const out=[];
  for(let n=1;n<=pdf.numPages;n++){const pg=await pdf.getPage(n);const v=pg.getViewport({scale:1,rotation:pg.rotate});
    out.push({id:nid(),src:{kind:'pdf',doc:idx,n,inh:pg.rotate||0,bw:v.width,bh:v.height},rot:0,annots:[]});}
  // existing bookmarks (outline) of the file
  try{const ol=await pdf.getOutline();
    if(ol&&ol.length){const walk=async(items,l)=>{for(const it of items){let k=-1;
        try{let d=it.dest;if(typeof d==='string')d=await pdf.getDestination(d);if(Array.isArray(d)&&d[0]!=null)k=typeof d[0]==='object'?await pdf.getPageIndex(d[0]):+d[0];}catch(e){}
        if(k>=0&&out[k])pendingBms.push({t:String(it.title||'—').trim()||'—',id:out[k].id,lvl:l});
        if(it.items&&it.items.length&&l<4)await walk(it.items,l+1);}};
      await walk(ol,0);}}catch(e){}
  return out;
}
async function imgPage(file){
  const url=await readFile(file,'url');let el;

function paintPreview(k,pr){

/* ---------- text extraction ---------- */
const textCache={};
// some PDFs store Arabic in visual (reversed) order; detect it per line and restore reading order
function fixVisualAr(line){if(!/[\u0621-\u064A]/.test(line))return line;
  const words=line.split(/\s+/).filter(w=>/[\u0621-\u064A]{2,}/.test(w));if(words.length<2&&!(words[0]&&/^[ةى]|لا$/.test(words[0])))return line;
  let rev=0,norm=0;for(const w0 of words){const w=w0.replace(/[^\u0621-\u064A]/g,'');if(!w)continue;
    if(/^[ةى]/.test(w))rev+=2;if(/ة$|ى$/.test(w))norm+=2;if(/^ال/.test(w))norm+=1.5;if(/لا$/.test(w)&&w.length>3)rev+=1.5;}
  if(rev<=norm||rev<2)return line;
  const r=[...line].reverse().join('');return r.replace(/[0-9٠-٩][0-9٠-٩.,٫٬]*|[A-Za-z][A-Za-z.'-]*/g,m=>[...m].reverse().join(''));}
async function pageText(p){
  if(p.ocr)return p.ocr;
  if(p.src.kind!=='pdf')return '';
  const k=p.src.doc+':'+p.src.n;if(textCache[k]!=null)return textCache[k];
  try{const pg=await S.sources[p.src.doc].pdf.getPage(p.src.n);const tc=await pg.getTextContent();
    const lines=[];let cur='',lastY=null;
    for(const it of tc.items){if(!('str' in it))continue;const y=Math.round(it.transform[5]);
      if(lastY!==null&&Math.abs(y-lastY)>3&&cur){lines.push(cur);cur='';}
      cur+=it.str.normalize('NFKC');if(it.hasEOL){lines.push(cur);cur='';}lastY=y;}
    if(cur)lines.push(cur);
    textCache[k]=lines.map(l=>fixVisualAr(l.replace(/\s+/g,' ').trim())).filter(Boolean).join('\n');
  }catch(e){textCache[k]='';}
  return textCache[k];
}
async function allText(limit=1e9){let out='';for(let i=0;i<S.pages.length;i++){const t=await pageText(S.pages[i]);if(t)out+=`\n[صفحة ${i+1}]\n`+t+'\n';if(out.length>limit)break;}return out.slice(0,limit);}

/* ---------- export ---------- */
function unrotate(c,R){
  if(!R)return c;const odd=R%180;const u=mkCanvas(odd?c.height:c.width,odd?c.width:c.height),x=u.getContext('2d');
  if(R===90){x.translate(0,u.height);x.rotate(-Math.PI/2);}else if(R===180){x.translate(u.width,u.height);x.rotate(Math.PI);}else{x.translate(u.width,0);x.rotate(Math.PI/2);}
  x.drawImage(c,0,0);return u;
}
async function renderFull(p,i,total,W,H,{annots=true}={}){const c=mkCanvas(W,H),x=c.getContext('2d');await paintSource(p,x,c.width,c.height);if(annots)paintAnnots(x,p,c.width,c.height,i,total);return c;}
const needsOverlay=p=>p.annots.length||S.settings.wm||S.settings.pn;
async function buildPdf({pages=S.pages,raster=null,onProgress}={}){
  const {PDFDocument,degrees}=PDFLib;const out=await PDFDocument.create();const libs={};const total=pages.length;const made=[];
  out.setTitle(baseName());out.setCreator('صفحات PDF');
  for(let i=0;i<pages.length;i++){const p=pages[i];onProgress&&onProgress(i/total);
    const d=dims(p),s=p.src;const gi=S.pages.indexOf(p),gt=S.pages.length;
    let rasterize=(!!raster&&!(raster.smart&&s.kind==='pdf'&&(await pageText(p)).trim().length>20))||!!p.filter||p.annots.some(a=>a.type==='redact')||(s.kind==='pdf'&&S.sources[s.doc].encrypted);
    if(!rasterize&&s.kind==='pdf'&&libs[s.doc]===undefined){try{libs[s.doc]=await PDFDocument.load(S.sources[s.doc].bytes,{ignoreEncryption:true});}catch(e){libs[s.doc]=null;}}
    if(s.kind==='pdf'&&libs[s.doc]===null)rasterize=true;
    if(rasterize){const dpi=raster?raster.dpi:170,k=dpi/72;const c=await renderFull(p,gi,gt,d.w*k,d.h*k);
      const im=await out.embedJpg(b64bytes(c.toDataURL('image/jpeg',raster?raster.q:.88)));const pg=out.addPage([d.w,d.h]);pg.drawImage(im,{x:0,y:0,width:d.w,height:d.h});
      made.push({p,pg,R:0,box:{x:0,y:0,width:d.w,height:d.h},raster:true});continue;}
    let pg,R,box;
    if(s.kind==='pdf'){const [cp]=await out.copyPages(libs[s.doc],[s.n-1]);pg=out.addPage(cp);R=(s.inh+p.rot)%360;pg.setRotation(degrees(R));box=pg.getCropBox();}
    else{pg=out.addPage([s.bw,s.bh]);if(s.kind==='img'){const im=await out.embedJpg(b64bytes(S.imgs[s.key].url));pg.drawImage(im,{x:0,y:0,width:s.bw,height:s.bh});}
      R=p.rot%360;pg.setRotation(degrees(R));box={x:0,y:0,width:s.bw,height:s.bh};}
    if(needsOverlay(p)){const k=2.6,oc=mkCanvas(d.w*k,d.h*k);paintAnnots(oc.getContext('2d'),p,oc.width,oc.height,gi,gt);
      const u=unrotate(oc,R);const png=await out.embedPng(b64bytes(u.toDataURL('image/png')));pg.drawImage(png,{x:box.x,y:box.y,width:box.width,height:box.height});}
    made.push({p,pg,R,box,raster:false});
  }
  try{finishPdf(out,made);}catch(e){console.warn('links/notes/outline',e);}
  onProgress&&onProgress(1);
  return await out.save();
}
async function savePdf(){

/* ---------- page operations ---------- */
function rotAnnots(p,cw){
  const d=dims(p),r=d.w/d.h;
  for(const a of p.annots){
    const f=cw?([x,y])=>[1-y,x]:([x,y])=>[y,1-x];
    if(a.type==='image'){const c=f([a.pts[0][0]+a.w/2,a.pts[0][1]+a.h/2]);const nw=a.w*r,nh=a.h/r;a.w=nw;a.h=nh;a.pts=[[c[0]-nw/2,c[1]-nh/2]];}
    else{a.pts=a.pts.map(f);if(a.size)a.size*=r;if(a.w)a.w*=r;}
  }
}
function rotatePage(p,cw=true){rotAnnots(p,cw);p.rot=(p.rot+(cw?90:270))%360;}
function clonePage(p){const c=JSON.parse(JSON.stringify(p));c.id=nid();return c;}
function blankPage(){const ref=S.pages[S.cur]||S.pages[0];const bw=ref?ref.src.bw:595.28,bh=ref?ref.src.bh:841.89;
  const [w,h]=ref&&ref.rot%180?[bh,bw]:[bw,bh];return {id:nid(),src:{kind:'blank',inh:0,bw:w,bh:h},rot:0,annots:[]};}

function pageOp(name){
  const sel=selectedOrCurrent();

  if(name==='blank'){pushUndo();const at=Math.min(S.pages.length,S.cur+1);S.pages.splice(at,0,blankPage());markDirty();refreshAll();toast('أُضيفت صفحة فارغة بعد الصفحة '+ar(at));return;}
  if(name==='add'){$('#fileAdd').click();return;}

  if(!sel.length){toast('حدّد صفحة واحدة على الأقل');return;}
  if(name==='rot'){pushUndo();sel.forEach(p=>rotatePage(p));markDirty();refreshAll();}
  if(name==='dup'){pushUndo();sel.slice().reverse().forEach(p=>{const i=S.pages.indexOf(p);S.pages.splice(i+1,0,clonePage(p));});markDirty();refreshAll();}
  if(name==='del'){if(sel.length===S.pages.length){toast('لا يمكن حذف كل الصفحات');return;}pushUndo();S.pages=S.pages.filter(p=>!S.selectedPages.has(p.id));S.selectedPages.clear();markDirty();refreshAll();toast('حُذفت '+ar(sel.length)+' صفحة — يمكنك التراجع');}

  if(PR.on){if(['ArrowLeft','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();prGo(1);return;}if(['ArrowRight','PageUp','Backspace'].includes(e.key)){e.preventDefault();prGo(-1);return;}if(e.key==='Home'){prGo(-1e6);return;}if(e.key==='End'){prGo(1e6);return;}if(e.key==='Escape'){closePresent();return;}}
  if(e.key==='Escape'){if(!$('#pop').hidden){$('#pop')._close();return;}if(!scrim.hidden){closeSheet(null);return;}if(!$('#crop').hidden){closeCrop();return;}if(!$('#scan').hidden){closeScanner();return;}}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();e.shiftKey?doRedo():doUndo();}});
const cancelBtn='<button class="hbtn" data-close>إلغاء</button>';
function wireClose(){sheet.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeSheet(null));}
function seg(name,opts,val){return `<div class="seg" data-seg="${name}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" class="${v===val?'on':''}">${l}</button>`).join('')}</div>`;}
function wireSeg(){sheet.querySelectorAll('[data-seg]').forEach(s=>s.querySelectorAll('button').forEach(b=>b.onclick=()=>{s.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');}));}
const segVal=n=>{const b=sheet.querySelector(`[data-seg="${n}"] .on`);return b?b.dataset.v:null;};

function stampPreview(label,color){const c=mkCanvas(240,110);drawA(c.getContext('2d'),{type:'stamp',pts:[[.5,.5]],label,color,size:.12},240,110);return c;}

function openSignSheet(){
  const saved=store.get('safahat-sigs',[]);
  openSheet(`<h3>التوقيع</h3>${saved.length?`<div class="sigs" id="sgl"></div>`:''}
    <p class="hint" style="margin:0">ارسم توقيعك داخل المربع</p><canvas class="pad" id="pad"></canvas>
    <div class="row">${seg('sc',[['#111111','أسود'],['#1d4ed8','أزرق']],'#1d4ed8')}<button class="hbtn" id="padClr">مسح</button></div>
    <div class="acts"><button class="hbtn primary" id="sgOk">حفظ واستخدام</button><button class="hbtn" id="sgImg">رفع صورة توقيع</button>${cancelBtn}</div>`);
  wireClose();wireSeg();
  if(saved.length){const l=$('#sgl');saved.forEach((u,i)=>{const b=document.createElement('button');b.innerHTML=`<img src="${u}" alt="توقيع محفوظ ${ar(i+1)}">`;
    b.onclick=async()=>usePendingImage(await addImg(u),'sign');l.appendChild(b);});}
  const pad=$('#pad');const r=pad.getBoundingClientRect();pad.width=r.width*DPR;pad.height=r.height*DPR;const x=pad.getContext('2d');x.lineCap='round';x.lineJoin='round';
  let down=false,last=null,has=false;
  pad.onpointerdown=e=>{down=true;pad.setPointerCapture(e.pointerId);const b=pad.getBoundingClientRect();last=[(e.clientX-b.left)*DPR,(e.clientY-b.top)*DPR];};
  pad.onpointermove=e=>{if(!down)return;const b=pad.getBoundingClientRect();const p=[(e.clientX-b.left)*DPR,(e.clientY-b.top)*DPR];x.strokeStyle=segVal('sc');x.lineWidth=3.2*DPR;
    x.beginPath();x.moveTo(last[0],last[1]);x.lineTo(p[0],p[1]);x.stroke();last=p;has=true;};
  pad.onpointerup=pad.onpointercancel=()=>{down=false;};
  $('#padClr').onclick=()=>{x.clearRect(0,0,pad.width,pad.height);has=false;};
  $('#sgImg').onclick=()=>{closeSheet();S.pendingKind='sign';$('#fileImg').click();};
  $('#sgOk').onclick=async()=>{if(!has){toast('ارسم التوقيع أولاً');return;}
    const t=trimCanvas(pad);const u=t.toDataURL('image/png');const list=store.get('safahat-sigs',[]);list.unshift(u);store.set('safahat-sigs',list.slice(0,4));
    usePendingImage(await addImg(u),'sign');};
}
function trimCanvas(c){const x=c.getContext('2d'),d=x.getImageData(0,0,c.width,c.height).data;let x0=c.width,y0=c.height,x1=0,y1=0;
  for(let y=0;y<c.height;y++)for(let X=0;X<c.width;X++){if(d[(y*c.width+X)*4+3]>10){if(X<x0)x0=X;if(X>x1)x1=X;if(y<y0)y0=y;if(y>y1)y1=y;}}
  const pad=8,w=Math.max(1,x1-x0+pad*2),h=Math.max(1,y1-y0+pad*2);const t=mkCanvas(w,h);t.getContext('2d').drawImage(c,x0-pad,y0-pad,w,h,0,0,w,h);return t;}
function usePendingImage(key,kind){S.pending={key};closeSheet();if(!(MODE[S.tab].tools||[]).includes(kind))setTab(kind==='sign'?'sign':'insert');setTool(kind);toast(kind==='sign'?'اضغط على الصفحة لوضع التوقيع':'اضغط على الصفحة لوضع الصورة');}

function openSearch(){
  openSheet(`<h3>بحث في الملف</h3>${AI?seg('qm',[['word','مطابقة الكلمات'],['ai','بحث بالمعنى (ذكي)']],'word'):''}<div class="ask"><input type="text" id="q" placeholder="كلمة أو عبارة، أو صف ما تبحث عنه"><button class="hbtn primary" id="qGo" aria-label="بحث">${ic('search')}</button></div>
    <div class="results" id="res"></div><div class="acts">${cancelBtn.replace('إلغاء','إغلاق')}</div>`);
  wireClose();wireSeg();
  const go=async()=>{const q=$('#q').value.trim();const res=$('#res');if(!q)return;
    if(segVal('qm')==='ai'){semanticSearch(q,res);return;}
    res.innerHTML='<p class="hint">جارٍ البحث…</p>';
    const norm=s=>s.replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').toLowerCase();
    const nq=norm(q);let html='',count=0;
    for(let i=0;i<S.pages.length;i++){const t=await pageText(S.pages[i]);if(!t)continue;
      for(const ln of t.split('\n')){const k=norm(ln).indexOf(nq);if(k<0)continue;count++;if(count>200)break;
        const before=esc(ln.slice(Math.max(0,k-40),k)),m=esc(ln.slice(k,k+q.length)),after=esc(ln.slice(k+q.length,k+q.length+50));
        html+=`<button data-p="${i}"><b>ص ${ar(i+1)}</b> — ${before}<mark>${m}</mark>${after}</button>`;}}
    res.innerHTML=count?`<p class="hint" style="margin:0">${ar(count)} نتيجة</p>`+html:'<p class="hint">لا توجد نتائج. إن كان الملف صوراً ممسوحة فلا يمكن البحث في نصه.</p>';
    res.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const n=+b.dataset.p;closeSheet();if(!inViewer())setTab('view');scrollToPage(n);});};
  $('#qGo').onclick=go;$('#q').onkeydown=e=>{if(e.key==='Enter')go();};
}

function runTool(k){
  if(!S.pages.length&&!['imgs','merge','scan','idcard','vault'].includes(k)){toast('افتح ملفاً أولاً');return;}
  const modeTool=(m,t)=>()=>{setTab(m);setTool(t);};
  const extra={bm:()=>openBookmarks(),ocr:openOcr,xlsx:exportXlsx,pptx:exportPptx,edittext:modeTool('edit','edittext'),form:()=>{setTab('sign');openForms();},link:modeTool('edit','link'),note:modeTool('annot','note'),
    protect:protectSheet,vault:()=>setTab('files'),comments:openComments,present:present,lasso:modeTool('annot','lasso'),hwrite:modeTool('annot','hwrite')};
  if(extra[k]){extra[k]();return;}
  ({merge:()=>$('#fileAdd').click(),pages:()=>setTab('pages'),blank:()=>{pageOp('blank');setTab('view');},
    imgs:()=>openScanner('docs','gal'),scan:()=>openScanner('docs','cam'),idcard:()=>openScanner('id'),filter:()=>openPageFilter('cur'),split:splitSheet,toimg:imgSheet,word:()=>exportText('docx'),txt:()=>exportText('txt'),
    compress:compressSheet,wm:wmSheet,num:numSheet,redact:()=>{setTab('redline');},sign:openSignSheet,stamp:openStampSheet,search:()=>{setTab('view');openSearch();},speak:()=>{setTab('view');speak();}})[k]();
}
function parseRanges(str,n){const out=[];for(const part of str.replace(/[٠-٩]/g,d=>AR.indexOf(d)).split(/[,،\s]+/)){if(!part)continue;
  const m=part.match(/^(\d+)(?:-(\d+))?$/);if(!m)return null;let a=+m[1],b=m[2]?+m[2]:a;if(a<1||b>n||a>b)return null;out.push([a,b]);}return out.length?out:null;}
function splitSheet(){
  openSheet(`<h3>تقسيم الملف</h3><label>طريقة التقسيم${seg('md',[['each','كل صفحة في ملف'],['ranges','حسب النطاقات']],'ranges')}</label>
    <label>النطاقات (عدد الصفحات ${ar(S.pages.length)})<input type="text" id="rg" placeholder="مثال: 1-3, 4-6, 9" value="1-${Math.ceil(S.pages.length/2)}, ${Math.ceil(S.pages.length/2)+1}-${S.pages.length}"></label>
    <p class="hint" style="margin:0">إن نتج أكثر من ملف تُجمع في ملف مضغوط ZIP واحد.</p>
    <div class="acts"><button class="hbtn primary" id="spOk">تقسيم وحفظ</button>${cancelBtn}</div>`);
  wireClose();wireSeg();
  $('#spOk').onclick=async()=>{let ranges;
    if(segVal('md')==='each')ranges=S.pages.map((_,i)=>[i+1,i+1]);
    else{ranges=parseRanges($('#rg').value,S.pages.length);if(!ranges){toast('اكتب النطاقات بشكل صحيح مثل 1-3, 5');return;}}
    closeSheet();showBusy('جارٍ التقسيم…');
    try{const files=[];for(let i=0;i<ranges.length;i++){const [a,b]=ranges[i];const bytes=await buildPdf({pages:S.pages.slice(a-1,b)});files.push([`${baseName()} (${a===b?a:a+'-'+b}).pdf`,bytes]);setBusy((i+1)/ranges.length);}
      hideBusy();
      if(files.length===1)saveFile(files[0][0],new Blob([files[0][1]]));
      else{const z=new JSZip();files.forEach(([n,b])=>z.file(n,b));saveFile(baseName()+' - مقسّم.zip',await z.generateAsync({type:'blob'}));}
    }catch(e){console.error(e);hideBusy();toast('تعذّر التقسيم');}};
}

async function exportText(kind){

/* ---------- AI helpers: page ranges, citations, tables, layout-preserving translation ---------- */
function parseRange(str,n){const t=toLatin(String(str||'')).replace(/[،؛]/g,',').replace(/[–—إلى]+/g,'-');const out=new Set();
  for(const part of t.split(/[,\s]+/).filter(Boolean)){const m=part.match(/^(\d+)(?:-(\d+))?$/);if(!m)return null;let a=+m[1],b=m[2]?+m[2]:a;if(a>b)[a,b]=[b,a];for(let i=a;i<=b;i++)if(i>=1&&i<=n)out.add(i-1);}
  return out.size?[...out].sort((x,y)=>x-y):null;}
function aiRangeIdx(){const r=($('#aiRange')||{}).value||'all';if(r==='cur')return [S.cur];if(r==='custom'){const v=parseRange(($('#aiPages')||{}).value,S.pages.length);if(!v){toast('اكتب أرقام صفحات صحيحة، مثل: ١-٣، ٥');return null;}return v;}return S.pages.map((_,i)=>i);}
function aiRangeLabel(idx){const g=[];let st=idx[0],pv=idx[0];for(const i of idx.slice(1).concat([null])){if(i===pv+1){pv=i;continue;}g.push(st===pv?ar(st+1):ar(st+1)+'-'+ar(pv+1));st=pv=i;}return g.join('، ');}

async function textToPages(title,text){
  if(!text)return;await fontsReady;
  const W=1240,H=1754,M=110,fs=34,lh=fs*1.85;const pages=[];let c,x,y;
  const np=()=>{c=mkCanvas(W,H);x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.direction='rtl';x.textAlign='right';x.textBaseline='top';x.fillStyle='#111';y=M;pages.push(c);};
  np();x.font=`700 46px ${FONT_D}`;x.fillStyle='#0b6e5f';x.fillText(title,W-M,y);y+=46*2;x.fillStyle='#111';
  x.font=`400 ${fs}px ${FONT}`;
  for(const para of text.split('\n')){
    if(!para.trim()){y+=lh*.5;continue;}
    const words=para.split(/\s+/);let line='';
    const flush=()=>{if(y+lh>H-M){np();x.font=`400 ${fs}px ${FONT}`;}x.fillText(line,W-M,y);y+=lh;line='';};
    for(const w of words){const t=line?line+' '+w:w;if(x.measureText(t).width>W-2*M&&line){flush();line=w;}else line=t;}
    if(line)flush();
  }
  pushUndo();
  for(const pc of pages){const key=await addImg(pc.toDataURL('image/jpeg',.92));S.pages.push({id:nid(),src:{kind:'img',key,inh:0,bw:595.28,bh:841.89},rot:0,annots:[]});}
  markDirty();refreshAll();setTab('view');requestAnimationFrame(()=>scrollToPage(S.pages.length-pages.length));toast('أُضيفت '+ar(pages.length)+' صفحة في نهاية الملف');
}

/* =====================================================================
   IMAGE FILTERS  (used by the scanner and by page filters)
   ===================================================================== */
const FILTERS=[['none','الأصلي'],['magic','سحري'],['shadow','بلا ظلال'],['sharp','وضوح النص'],['doc','مستند'],['gray','رمادي'],['vivid','زاهٍ'],['bright','فاتح']];
const FNAME=Object.fromEntries(FILTERS);
// local paper brightness, so shadows and uneven light can be divided out
function illumRows(d,W,H){
  const B=Math.max(12,Math.round(Math.max(W,H)/40));
  const gw=Math.ceil(W/B),gh=Math.ceil(H/B);const g=new Float32Array(gw*gh);const hist=new Uint16Array(64);
  const st=Math.max(1,Math.floor(B/6));
  for(let by=0;by<gh;by++)for(let bx=0;bx<gw;bx++){hist.fill(0);let n=0;
    const x1=Math.min(W,(bx+1)*B),y1=Math.min(H,(by+1)*B);
    for(let y=by*B;y<y1;y+=st)for(let x=bx*B;x<x1;x+=st){const i=(y*W+x)*4;hist[(d[i]*77+d[i+1]*150+d[i+2]*29)>>10]++;n++;}
    let acc=0,v=63;const t=n*.9;for(let k=0;k<64;k++){acc+=hist[k];if(acc>=t){v=k;break;}}
    g[by*gw+bx]=v*4+2;}
  let g2=new Float32Array(g.length);
  for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){let m=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const yy=y+dy,xx=x+dx;if(yy<0||xx<0||yy>=gh||xx>=gw)continue;const v=g[yy*gw+xx];if(v>m)m=v;}g2[y*gw+x]=m;}
  for(let pass=0;pass<2;pass++){const o=new Float32Array(g2.length);for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){let s=0,c=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const yy=y+dy,xx=x+dx;if(yy<0||xx<0||yy>=gh||xx>=gw)continue;s+=g2[yy*gw+xx];c++;}o[y*gw+x]=s/c;}g2=o;}
  const row=new Float32Array(W),tmp=new Float32Array(gw),xi0=new Int32Array(W),xf=new Float32Array(W);
  for(let x=0;x<W;x++){let fx=(x+.5)/B-.5;if(fx<0)fx=0;if(fx>gw-1)fx=gw-1;const i0=gw>1?Math.min(gw-2,Math.floor(fx)):0;xi0[x]=i0;xf[x]=gw>1?fx-i0:0;}
  return y=>{let fy=(y+.5)/B-.5;if(fy<0)fy=0;if(fy>gh-1)fy=gh-1;const j0=gh>1?Math.min(gh-2,Math.floor(fy)):0,ty=gh>1?fy-j0:0;
    for(let x=0;x<gw;x++)tmp[x]=gh>1?g2[j0*gw+x]*(1-ty)+g2[(j0+1)*gw+x]*ty:g2[x];
    for(let x=0;x<W;x++){const i0=xi0[x];row[x]=gw>1?tmp[i0]*(1-xf[x])+tmp[i0+1]*xf[x]:tmp[0];}
    return row;};
}
function lumHist(d){const h=new Uint32Array(256);for(let i=0;i<d.length;i+=16)h[(d[i]*77+d[i+1]*150+d[i+2]*29)>>8]++;return h;}
function pctl(h,p){let tot=0;for(let i=0;i<256;i++)tot+=h[i];const t=tot*p;let acc=0;for(let i=0;i<256;i++){acc+=h[i];if(acc>=t)return i;}return 255;}
function applyFilterData(img,f){
  if(!f||f==='none')return;
  const d=img.data,W=img.width,H=img.height;
  if(f==='shadow'||f==='sharp'){
    // divide out shadows and uneven light while keeping the real colours (and white paper)
    const bgRow=illumRows(d,W,H);
    for(let y=0;y<H;y++){const row=bgRow(y);let i=y*W*4;for(let x=0;x<W;x++,i+=4){const k=250/Math.max(row[x],40);d[i]*=k;d[i+1]*=k;d[i+2]*=k;}}
    if(f==='sharp'){ // unsharp mask on luminance + gentle contrast so thin strokes and small print read clearly
      const L=new Uint8Array(W*H);for(let j=0,i=0;j<L.length;j++,i+=4)L[j]=(d[i]*77+d[i+1]*150+d[i+2]*29)>>8;
      const B=boxBlurU8(L,W,H,Math.max(1,Math.round(Math.min(W,H)/700)));
      for(let j=0,i=0;j<L.length;j++,i+=4){const diff=(L[j]-B[j])*1.6;for(let c=0;c<3;c++){let v=d[i+c]+diff;v=(v-128)*1.12+128;if(v>238)v=255;d[i+c]=v;}}}
    return;}
  if(f==='magic'||f==='doc'){
    const bgRow=illumRows(d,W,H);
    for(let y=0;y<H;y++){const row=bgRow(y);let i=y*W*4;
      for(let x=0;x<W;x++,i+=4){const k=255/Math.max(row[x],48);let r=d[i]*k,g=d[i+1]*k,b=d[i+2]*k;
        if(f==='magic'){r=(r-38)*1.18;g=(g-38)*1.18;b=(b-38)*1.18;const l=r*.299+g*.587+b*.114;d[i]=l+(r-l)*1.28;d[i+1]=l+(g-l)*1.28;d[i+2]=l+(b-l)*1.28;}
        else{const l=r*.299+g*.587+b*.114;const v=l>=212?255:l<=160?0:(l-160)*4.9;d[i]=d[i+1]=d[i+2]=v;}}}
    return;}
  const h=lumHist(d);const lo=pctl(h,.01),hi=Math.max(lo+40,pctl(h,.99));const lut=new Uint8ClampedArray(256);
  if(f==='gray'){for(let v=0;v<256;v++)lut[v]=(v-lo)*255/(hi-lo);
    for(let i=0;i<d.length;i+=4){const l=lut[(d[i]*77+d[i+1]*150+d[i+2]*29)>>8];d[i]=d[i+1]=d[i+2]=l;}return;}

  else{sat=1.08;for(let v=0;v<256;v++)lut[v]=255*Math.pow(v/255,.7)+6;}
  for(let i=0;i<d.length;i+=4){const r=lut[d[i]],g=lut[d[i+1]],b=lut[d[i+2]];const l=r*.299+g*.587+b*.114;d[i]=l+(r-l)*sat;d[i+1]=l+(g-l)*sat;d[i+2]=l+(b-l)*sat;}
}

async function pageRuns(p){

  let items=[];

    if(ln){ln.parts.push(it);ln.x0=Math.min(ln.x0,it.x0);ln.x1=Math.max(ln.x1,it.x1);ln.y0=Math.min(ln.y0,it.y0);ln.y1=Math.max(ln.y1,it.y1);ln.size=Math.max(ln.size,it.size);}

  const W=v.c.width,H=v.c.height;let [x0,y0,x1,y1]=box;x0=Math.max(0,Math.floor(x0*W)-3);y0=Math.max(0,Math.floor(y0*H)-3);x1=Math.min(W,Math.ceil(x1*W)+3);y1=Math.min(H,Math.ceil(y1*H)+3);
  if(x1-x0<3||y1-y0<3)return out;
  let d;try{d=v.c.getContext('2d').getImageData(x0,y0,x1-x0,y1-y0).data;}catch(e){return out;}
  const w=x1-x0,h=y1-y0,ring=[[],[],[]],inner=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;const edge=x<2||y<2||x>=w-2||y>=h-2;if(edge){ring[0].push(d[i]);ring[1].push(d[i+1]);ring[2].push(d[i+2]);}else inner.push(i);}
  const med=a=>{a.sort((p,q)=>p-q);return a[a.length>>1]||255;};const bg=[med(ring[0]),med(ring[1]),med(ring[2])];
  const far=inner.map(i=>[Math.abs(d[i]-bg[0])+Math.abs(d[i+1]-bg[1])+Math.abs(d[i+2]-bg[2]),i]).filter(z=>z[0]>90).sort((a,b)=>b[0]-a[0]);
  const hex=c=>'#'+c.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
  out.bg=hex(bg);
  if(far.length){const top=far.slice(0,Math.max(3,Math.floor(far.length*.35)));const s=[0,0,0];for(const [,i] of top){s[0]+=d[i];s[1]+=d[i+1];s[2]+=d[i+2];}out.fg=hex(s.map(v=>v/top.length));}
  return out;
}

async function regionBlob(p,pts){const d=dims(p),W=1800,H=Math.round(W*d.h/d.w);const c=mkCanvas(W,H);await paintSource(p,c.getContext('2d'),W,H);

  const r=mkCanvas(pw,ph);r.getContext('2d').drawImage(c,px,py,pw,ph,0,0,pw,ph);c.width=c.height=0;return await new Promise(res=>r.toBlob(res,'image/png'));}

/* ---------- text geometry: reuse the line runs used by text editing ---------- */
async function pageItems(p){if(!p||p.src.kind!=='pdf')return [];return (await pageRuns(p)).flatMap(l=>l.parts);}
function linesOf(items){const lines=[];
  for(const it of items.slice().sort((p,q)=>p.y0-q.y0)){const cy=(it.y0+it.y1)/2,h=it.y1-it.y0;
    let L=lines.find(l=>Math.abs(l.cy-cy)<Math.max(h,l.h)*.5);
    if(L){L.items.push(it);L.x0=Math.min(L.x0,it.x0);L.x1=Math.max(L.x1,it.x1);L.y0=Math.min(L.y0,it.y0);L.y1=Math.max(L.y1,it.y1);}
    else lines.push({cy,h,items:[it],x0:it.x0,x1:it.x1,y0:it.y0,y1:it.y1});}
  return lines.sort((a,b)=>a.cy-b.cy);}
function markUpd(id){const d=drag;if(!d||d.kind!=='mark')return;d.a=null;
  if(d.items&&d.items.length){
    const x0=Math.min(d.start[0],d.cur[0]),x1=Math.max(d.start[0],d.cur[0]),y0=Math.min(d.start[1],d.cur[1]),y1=Math.max(d.start[1],d.cur[1]);
    const sel=d.items.filter(it=>it.x1>x0&&it.x0<x1&&it.y1>y0&&it.y0<y1);
    const clip=x1-x0>.012;const pts=[];let txt=[];
    for(const L of linesOf(sel)){const a=clip?Math.max(L.x0,x0):L.x0,b=clip?Math.min(L.x1,x1):L.x1;if(b-a<.002)continue;pts.push([a,L.y0],[b,L.y1]);txt.push(L.items.map(i=>i.str).join(' '));}
    if(pts.length)d.a={type:'markup',style:d.style,color:d.color,op:d.op,pts,text:txt.join(' ').slice(0,300)};}
  drawOverlay(id);}

/* ---------- finishing the saved PDF: links, notes, outline, flattened forms ---------- */
function finishPdf(out,made){
  const {PDFName,PDFString,PDFHexString,PDFDict,PDFArray}=PDFLib;const ctx=out.context;
  const refOf=new Map(made.map(m=>[m.p.id,m.pg.ref]));
  const toPdf=(m,u,v)=>{let a=u,b=v;if(m.R===90){a=v;b=1-u;}else if(m.R===180){a=1-u;b=1-v;}else if(m.R===270){a=1-v;b=u;}return [m.box.x+a*m.box.width,m.box.y+(1-b)*m.box.height];};
  const annotsOf=pg=>{let arr=pg.node.lookupMaybe(PDFName.of('Annots'),PDFArray);if(!arr){arr=ctx.obj([]);pg.node.set(PDFName.of('Annots'),arr);}return arr;};
  const add=(pg,dict)=>annotsOf(pg).push(ctx.register(ctx.obj(dict)));
  for(const m of made){
    if(!m.raster&&m.p.annots.some(a=>a.type==='formval')){const arr=m.pg.node.lookupMaybe(PDFName.of('Annots'),PDFArray);
      if(arr)for(let i=arr.size()-1;i>=0;i--){const d=arr.lookupMaybe(i,PDFDict);if(d&&d.get(PDFName.of('Subtype'))===PDFName.of('Widget'))arr.remove(i);}}
    for(const a of m.p.annots){
      if(a.type==='link'){const p0=toPdf(m,a.pts[0][0],a.pts[0][1]),p1=toPdf(m,a.pts[1][0],a.pts[1][1]);
        const d={Type:'Annot',Subtype:'Link',Rect:[Math.min(p0[0],p1[0]),Math.min(p0[1],p1[1]),Math.max(p0[0],p1[0]),Math.max(p0[1],p1[1])],Border:[0,0,0],F:4};
        if(a.url)d.A={Type:'Action',S:'URI',URI:PDFString.of(a.url)};else if(a.pageId&&refOf.has(a.pageId))d.Dest=[refOf.get(a.pageId),'Fit'];else continue;
        add(m.pg,d);}
      else if(a.type==='note'){const c=toPdf(m,a.pts[0][0],a.pts[0][1]),s=16;
        add(m.pg,{Type:'Annot',Subtype:'Text',Rect:[c[0]-s/2,c[1]-s/2,c[0]+s/2,c[1]+s/2],Contents:PDFHexString.fromText(a.text),T:PDFHexString.fromText('ملاحظة'),Name:'Comment',C:hexRgb(a.color),F:4,Open:false});}
    }}
  const bms=(S.settings.bms||[]).filter(b=>refOf.has(b.id));
  if(bms.length){
    const nodes=bms.map(b=>({b,ref:ctx.nextRef(),kids:[]}));const top=[],stack=[];
    for(const n of nodes){const l=Math.min(Math.max(0,n.b.lvl|0),stack.length);stack.length=l;(l?stack[l-1].kids:top).push(n);stack.push(n);}
    const root=ctx.nextRef();
    const emit=(list,parent)=>list.forEach((n,i)=>{const d={Title:PDFHexString.fromText(n.b.t),Parent:parent,Dest:[refOf.get(n.b.id),'Fit']};
      if(i>0)d.Prev=list[i-1].ref;if(i<list.length-1)d.Next=list[i+1].ref;
      if(n.kids.length){d.First=n.kids[0].ref;d.Last=n.kids[n.kids.length-1].ref;d.Count=n.kids.length;emit(n.kids,n.ref);}
      ctx.assign(n.ref,ctx.obj(d));});
    emit(top,root);
    ctx.assign(root,ctx.obj({Type:'Outlines',First:top[0].ref,Last:top[top.length-1].ref,Count:top.length}));
    out.catalog.set(PDFName.of('Outlines'),root);out.catalog.set(PDFName.of('PageMode'),PDFName.of('UseOutlines'));}
}

  const hist=chatHist.filter(m=>!m.err&&!m.skip&&!m.live);

  const live={role:'assistant',content:'أفكّر…',live:true};chatHist.push(live);renderChat();
  if(chatCtl)chatCtl.abort();chatCtl=new AbortController();
  const bubble=()=>{const log=document.getElementById('chat');return log&&log.lastElementChild;};
  try{const r=await AI(msgs,{signal:chatCtl.signal,cache:false,modelTier:'default',...(images?{images}:{}),onText:({text})=>{live.content=text||'أفكّر…';const b=bubble();if(b)b.textContent=cleanAI(live.content)||'أفكّر…';}});

function itemsToRows(items,r){
  const rows=[];
  for(const L of linesOf(items)){const rtl=L.items.filter(i=>i.rtl).length*2>=L.items.length;
    const its=L.items.slice().sort((a,b)=>rtl?b.x1-a.x1:a.x0-b.x0);const cells=[];let cur=null,prev=null;
    for(const it of its){const hx=(it.y1-it.y0)/r;const gap=prev?(rtl?prev.x0-it.x1:it.x0-prev.x1):0;
      if(!cur||gap>hx*1.1){cur=[it.str];cells.push(cur);}else cur.push(it.str);prev=it;}
    rows.push(cells.map(c=>{const s=c.join(rtl?' ':' ').replace(/\s+/g,' ').trim();const n=toLatin(s).replace(/٫/g,'.').replace(/[٬,]/g,'');return /^-?\d+(\.\d+)?$/.test(n)&&n.length<16?+n:s;}));}
  return rows;}

/* ---------- real PDF encryption: Standard security handler V5/R6, AES-256 (ISO 32000-2) ---------- */
const PDFENC=(()=>{
  const sub=()=>crypto.subtle;

  async function cbcNoPad(keyBytes,iv,data){const k=await sub().importKey('raw',keyBytes,{name:'AES-CBC'},false,['encrypt']);
    const out=new Uint8Array(await sub().encrypt({name:'AES-CBC',iv},k,data));return out.slice(0,data.length);}
  // Algorithm 2.B
  async function hash2B(password,salt,udata){
    let K=await sha('SHA-256',cat(password,salt,udata));let round=0,E;
    while(true){
      const one=cat(password,K,udata),K1=new Uint8Array(one.length*64);for(let i=0;i<64;i++)K1.set(one,i*one.length);
      E=await cbcNoPad(K.slice(0,16),K.slice(16,32),K1);
      let m=0;for(let i=0;i<16;i++)m+=E[i];m%=3;
      K=await sha(m===0?'SHA-256':m===1?'SHA-384':'SHA-512',E);
      round++;

    }
    return K.slice(0,32);
  }
  async function aesEncrypt(fileKey,data){const iv=rnd(16);const k=await sub().importKey('raw',fileKey,{name:'AES-CBC'},false,['encrypt']);
    return cat(iv,new Uint8Array(await sub().encrypt({name:'AES-CBC',iv},k,data)));}
  // P flags (ISO 32000 Table 22): bit3 print, 4 modify, 5 copy, 6 annotate, 9 fill forms, 10 accessibility, 11 assemble, 12 high-quality print
  function pValue({print=true,copy=false,modify=false,annotate=false}={}){
    let p=0xFFFFF0C0; // reserved bits set, bits 1-2 zero
    if(print)p|=(1<<2)|(1<<11);
    if(modify)p|=(1<<3)|(1<<10);
    if(copy)p|=(1<<4);
    if(annotate)p|=(1<<5)|(1<<8);
    p|=(1<<9); // accessibility extraction always allowed
    return p|0;
  }
  async function buildEncrypt(userPw,ownerPw,perms){
    const fileKey=rnd(32),u=pw(userPw),o=pw(ownerPw);
    const uvs=rnd(8),uks=rnd(8);
    const U=cat(await hash2B(u,uvs,new Uint8Array(0)),uvs,uks);
    const UE=await cbcNoPad(await hash2B(u,uks,new Uint8Array(0)),new Uint8Array(16),fileKey);
    const ovs=rnd(8),oks=rnd(8);
    const O=cat(await hash2B(o,ovs,U),ovs,oks);
    const OE=await cbcNoPad(await hash2B(o,oks,U),new Uint8Array(16),fileKey);
    const P=pValue(perms);
    const pb=new Uint8Array(16);const dv=new DataView(pb.buffer);dv.setInt32(0,P,true);dv.setUint32(4,0xFFFFFFFF,true);
    pb[8]='T'.charCodeAt(0);pb[9]='a'.charCodeAt(0);pb[10]='d'.charCodeAt(0);pb[11]='b'.charCodeAt(0);pb.set(rnd(4),12);
    const Perms=await cbcNoPad(fileKey,new Uint8Array(16),pb);
    return {fileKey,U,UE,O,OE,P,Perms};
  }
  const hex=b=>Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');
  // Encrypt a PDF (bytes) — keeps text, fonts, vectors exactly; only wraps every string and stream in AES-256
  async function encrypt(bytes,{userPassword,ownerPassword,permissions}={}){
    const L=PDFLib;const {PDFDocument,PDFName,PDFDict,PDFArray,PDFString,PDFHexString,PDFStream,PDFRawStream,PDFNumber,PDFRef}=L;
    const doc=await PDFDocument.load(bytes,{updateMetadata:false});
    const ctx=doc.context;
    const owner=ownerPassword||hex(rnd(16));
    const E=await buildEncrypt(userPassword||'',owner,permissions);
    const jobs=[];
    const encStr=s=>{const raw=s.asBytes();const ph=PDFHexString.of('');jobs.push(aesEncrypt(E.fileKey,raw).then(b=>{ph.value=hex(b);}));return ph;};
    const walk=o=>{
      if(o instanceof PDFString||o instanceof PDFHexString)return encStr(o);
      if(o instanceof PDFArray){for(let i=0;i<o.size();i++){const v=o.get(i),n=walk(v);if(n!==v)o.set(i,n);}return o;}

        const contents=obj.getContents();

          dict.set(PDFName.of('Length'),PDFNumber.of(enc.length));
          ctx.assign(ref,PDFRawStream.of(dict,enc));}));

    }

})();

let DB=null;
const LB={docs:[],folders:[],tab:'home',seg:'recent',sort:'opened',folder:null,q:''};
function idbOpen(){return new Promise(res=>{let done=false;const fin=v=>{if(done)return;done=true;clearTimeout(t);res(v);};const t=setTimeout(()=>fin(null),2500);
  try{const r=indexedDB.open('safahat-library',1);
    r.onupgradeneeded=()=>{const d=r.result;for(const n of ['docs','data','folders'])if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'});};
    r.onsuccess=()=>{const d=r.result;d.onclose=()=>{if(DB===d)DB=null;};d.onversionchange=()=>{d.close();if(DB===d)DB=null;};fin(d);};r.onerror=()=>fin(null);r.onblocked=()=>fin(null);}catch(e){fin(null);}});}
function idbx1(store,mode,fn){return new Promise((res,rej)=>{try{const tx=DB.transaction(store,mode),r=fn(tx.objectStore(store));
  tx.oncomplete=()=>res(r?r.result:undefined);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);}catch(e){rej(e);}});}
// iPad/iPhone: WebKit drops the IndexedDB connection when the app goes to the background (camera, other apps) — reopen once and retry
let reopening=null;
async function idbx(store,mode,fn){
  if(!DB){reopening=reopening||idbOpen().finally(()=>{reopening=null;});DB=await reopening;if(!DB)throw new Error('no-db');}
  try{return await idbx1(store,mode,fn);}
  catch(e){if(e&&(e.name==='QuotaExceededError'||e.name==='DataCloneError'))throw e;
    try{DB&&DB.close();}catch(_){}DB=null;reopening=reopening||idbOpen().finally(()=>{reopening=null;});DB=await reopening;if(!DB)throw e;return await idbx1(store,mode,fn);}}

function fmtWhen(ts){if(!ts)return '';const d=new Date(ts),n=new Date();

async function indexDocFromData(meta){
  const data=await dbGet('data',meta.id);if(!data)return '';const pdfs=[];let out='';
  try{for(const s0 of data.sources||[]){try{pdfs.push(await pdfFromBytes(s0.bytes));}catch(e){pdfs.push(null);}}
    for(let i=0;i<(data.pages||[]).length&&out.length<80000;i++){const p=data.pages[i];let t='';
      if(p.ocr)t=p.ocr;else if(p.src&&p.src.kind==='pdf'&&pdfs[p.src.doc]){try{const pg=await pdfs[p.src.doc].getPage(p.src.n);const tc=await pg.getTextContent();
        let cur='',lastY=null;const lines=[];for(const it of tc.items){if(!('str' in it))continue;const y=Math.round(it.transform[5]);if(lastY!==null&&Math.abs(y-lastY)>3&&cur){lines.push(cur);cur='';}cur+=it.str.normalize('NFKC');lastY=y;}if(cur)lines.push(cur);t=lines.map(l=>fixVisualAr(l.replace(/\s+/g,' ').trim())).join('\n');}catch(e){}}
      if(t.trim())out+=`\n[صفحة ${i+1}]\n`+t+'\n';}
    out+='\n'+annotText(data.pages||[]);}

   BACKUP · RESTORE · FOLDERS · DUPLICATES · STORAGE · CLOUD SYNC
   ===================================================================== */
const BK={magic:new TextEncoder().encode('SAFAHAT-BK2'),iter:600000};
const u8b64=u=>{u=u instanceof Uint8Array?u:new Uint8Array(u);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);};
const b64u8=s=>{const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
async function bkKey(pass,salt,iter=BK.iter){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(String(pass).normalize('NFKC')),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function bkEncrypt(bytes,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const k=await bkKey(pass,salt);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,bytes));const out=new Uint8Array(BK.magic.length+1+16+12+ct.length);
  out.set(BK.magic,0);out[BK.magic.length]=1;out.set(salt,BK.magic.length+1);out.set(iv,BK.magic.length+17);out.set(ct,BK.magic.length+29);return out;}
const isEncBackup=u=>u.length>40&&BK.magic.every((c,i)=>u[i]===c);
async function bkDecrypt(u,pass){const o=BK.magic.length;const salt=u.slice(o+1,o+17),iv=u.slice(o+17,o+29),ct=u.slice(o+29);const k=await bkKey(pass,salt);
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},k,ct));}
async function sha256hex(u){const h=new Uint8Array(await crypto.subtle.digest('SHA-256',u));return Array.from(h,b=>b.toString(16).padStart(2,'0')).join('');}

async function buildBackupZip({docIds=null,includeFiles=true,includeFonts=true,onProgress}={}){
  if(S.dirty&&S.docId)await saveProject();
  const zip=new JSZip();const docs=(await dbAll('docs')).filter(d=>!docIds||docIds.includes(d.id));const folders=await dbAll('folders');
  const man={app:'safahat',format:2,created:Date.now(),docs:[],folders:docIds?folders.filter(f=>docs.some(d=>d.folder===f.id)):folders,files:[],fonts:[],vaultMeta:null};
  let i=0;
  for(const d of docs){const data=await dbGet('data',d.id);if(!data)continue;
    const srcs=(data.sources||[]).map((s,k)=>{const f=`docs/${d.id}/${k}.bin`;zip.file(f,s.bytes);return {name:s.name,file:f};});
    zip.file(`docs/${d.id}.json`,JSON.stringify({...data,sources:srcs}));man.docs.push(d);onProgress&&onProgress(++i/(docs.length+2));}
  if(includeFiles){try{const files=await libAll();

/* ---- merge a backup zip into this device (never deletes local files; the newer copy wins) ---- */
async function restoreZip(bytes,{onProgress}={}){
  const zip=await JSZip.loadAsync(bytes);const mf=zip.file('manifest.json');if(!mf)throw new Error('not-a-backup');
  const man=JSON.parse(await mf.async('string'));if(man.app!=='safahat')throw new Error('not-a-backup');
  const R={docs:0,skipped:0,folders:0,files:0,locked:0,lockedSkipped:0,fonts:0};
  const localFolders=new Set((await dbAll('folders')).map(f=>f.id));
  for(const f of man.folders||[])if(!localFolders.has(f.id)){await dbPut('folders',f);R.folders++;}
  const local=Object.fromEntries((await dbAll('docs')).map(d=>[d.id,d]));let i=0;
  for(const d of man.docs||[]){i++;onProgress&&onProgress(i/(man.docs.length+1));
    const l=local[d.id];if(l&&(l.modified||0)>=(d.modified||0)){R.skipped++;continue;}
    const jf=zip.file(`docs/${d.id}.json`);if(!jf)continue;const data=JSON.parse(await jf.async('string'));
    data.sources=await Promise.all((data.sources||[]).map(async s=>({name:s.name,bytes:await zip.file(s.file).async('uint8array')})));
    await dbPut('data',data);await dbPut('docs',d);R.docs++;}
  if(man.files&&man.files.length){let localVault=await metaGet('vault').catch(()=>null);let vaultOk=true;
    if(man.vaultMeta){const bm=man.vaultMeta;
      if(!localVault){await metaSet('vault',{salt:b64u8(bm.salt),iter:bm.iter,check:{iv:b64u8(bm.check.iv),ct:b64u8(bm.check.ct).buffer}});}
      else if(u8b64(localVault.salt)!==bm.salt)vaultOk=false;}
    const lf=Object.fromEntries((await libAll().catch(()=>[])).map(r=>[r.id,r]));
    for(const e of man.files){const l=lf[e.id];if(l&&(l.date||0)>=(e.date||0))continue;const bin=await zip.file(`files/${e.id}.bin`).async('uint8array');
      if(e.locked){if(!vaultOk){R.lockedSkipped++;continue;}
        await libPut({id:e.id,locked:true,date:e.date,size:e.size,blob:{iv:b64u8(e.iv),ct:bin.buffer},meta:{iv:b64u8(e.meta.iv),ct:b64u8(e.meta.ct).buffer}});R.locked++;}
      else{await libPut({id:e.id,date:e.date,size:e.size,data:bin.buffer,name:e.name,pages:e.pages,thumb:e.thumb});R.files++;}}}
  for(const f of man.fonts||[]){if(FONT_BY[f.id])continue;try{const data=(await zip.file(`fonts/${f.id}.bin`).async('uint8array')).buffer;const rec={id:f.id,name:f.name,data,added:f.added};
      await registerUserFont(rec);await fdb('readwrite',st=>st.put(rec));R.fonts++;}catch(e){}}
  await libLoad();return {R,man};
}
function restoreSummary(R){const p=[];if(R.docs)p.push(cnt(R.docs,'file'));if(R.folders)p.push(R.folders===1?'مجلد واحد':ar(R.folders)+' مجلدات');if(R.files+R.locked)p.push(ar(R.files+R.locked)+' من النسخ المحفوظة');if(R.fonts)p.push(R.fonts===1?'خط واحد':ar(R.fonts)+' خطوط');
  let s=p.length?'استُعيد: '+p.join('، '):'لا جديد: كل ما في النسخة موجود على هذا الجهاز بنفس الحداثة أو أحدث';
  if(R.skipped&&p.length)s+='. وتُرك '+cnt(R.skipped,'file')+' لأن نسخها هنا أحدث';if(R.lockedSkipped)s+='. لم تُستورد '+cnt(R.lockedSkipped,'file')+' مشفّرة لأن رمز المجلد الخاص هنا مختلف';return s;}

          h=await sha256hex(all)+':'+(data.pages||[]).length;d.hash=h;await dbPut('docs',d);}else if(data){h=await sha256hex(new TextEncoder().encode(JSON.stringify(data.pages||[]).slice(0,200000)));}}

/* ---- GitHub provider: works in the iPhone/iPad/Android app (private repo + fine-grained token) ---- */
const ghCfg=()=>{try{const c=JSON.parse(localStorage.getItem('safahat-gh')||'null');return c&&c.repo&&c.token?c:null;}catch(e){return null;}};
const ghSet=c=>{try{c?localStorage.setItem('safahat-gh',JSON.stringify(c)):localStorage.removeItem('safahat-gh');}catch(e){}SYNC.prov=undefined;};
const GH_DIR='safahat-sync';
async function gh(path,{method='GET',raw=false,body=null,cfg=null}={}){const c=cfg||ghCfg();if(!c)throw Object.assign(new Error('no gh'),{code:'not_granted'});
  const url=path.startsWith('/')?'https://api.github.com'+path:`https://api.github.com/repos/${c.repo}/contents/${path}`;
  const r=await fetch(url+(method==='GET'&&!path.startsWith('/')?(url.includes('?')?'&':'?')+'t='+Date.now():''),{method,cache:'no-store',headers:{Authorization:'Bearer '+c.token,Accept:raw?'application/vnd.github.raw':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):null});
  if(r.status===401||r.status===403)throw Object.assign(new Error('auth'),{code:'gh_auth',status:r.status});
  return r;}
async function ghTest(cfg){const r=await gh('/repos/'+cfg.repo,{cfg});if(r.status===404)return 'المستودع غير موجود أو الرمز لا يملك صلاحية عليه';if(!r.ok)return 'تعذّر الاتصال بـ GitHub ('+r.status+')';
  const j=await r.json();if(j.permissions&&j.permissions.push===false)return 'الرمز لا يملك صلاحية الكتابة. فعّل Contents: Read and write';if(!j.private)return 'private-warning';return '';}
async function ghRemote(){const r=await gh(GH_DIR+'/manifest.json',{raw:true});if(r.status===404)return null;if(!r.ok)throw new Error('gh '+r.status);return JSON.parse(await r.text());}
async function ghPull(key,remote){const parts=[];for(const pt of remote.parts){const r=await gh(pt.path,{raw:true});if(!r.ok)throw new Error('gh part '+r.status);parts.push(new Uint8Array(await r.arrayBuffer()));}
  const n=parts.reduce((a,b)=>a+b.length,0),u=new Uint8Array(n);let o=0;for(const q of parts){u.set(q,o);o+=q.length;}
  const plain=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u8(remote.iv)},key,u));const {R}=await restoreZip(plain,{});store.set('safahat-sync-pulled',remote.updated);return R;}
async function ghPush(key,salt,remote,onProgress){
  const {bytes,man}=await buildBackupZip({onProgress:f=>onProgress&&onProgress(f*.45)});
  const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes));
  const ts=Date.now(),CH=15*1024*1024,parts=[];
  for(let o=0,k=0;o<ct.length;o+=CH,k++){const path=`${GH_DIR}/p-${ts}-${k}.bin`;const r=await gh(path,{method:'PUT',body:{message:'صفحات: مزامنة',content:u8b64(ct.subarray(o,o+CH))}});
    if(!r.ok)throw Object.assign(new Error('gh put '+r.status),{code:r.status===413||r.status===422?'too_large':'gh'});const j=await r.json();parts.push({path,sha:j.content.sha});onProgress&&onProgress(.5+.4*Math.min(1,(o+CH)/ct.length));}
  const doc={v:3,salt:u8b64(salt),iter:BK.iter,iv:u8b64(iv),parts,updated:ts,size:ct.length,docs:man.docs.length,device:deviceName()};
  const cur=await gh(GH_DIR+'/manifest.json');const sha=cur.ok?(await cur.json()).sha:undefined;
  const w=await gh(GH_DIR+'/manifest.json',{method:'PUT',body:{message:'صفحات: مزامنة',content:u8b64(new TextEncoder().encode(JSON.stringify(doc))),...(sha?{sha}:{})}});
  if(!w.ok)throw new Error('gh manifest '+w.status);
  if(remote&&remote.parts)for(const pt of remote.parts){try{await gh(pt.path,{method:'DELETE',body:{message:'صفحات: تنظيف',sha:pt.sha}});}catch(e){}}
  store.set('safahat-sync-pulled',doc.updated);store.set('safahat-sync-pushed',doc.updated);SYNC.remote=doc;onProgress&&onProgress(1);return doc;}
async function ghWipe(remote){if(remote)for(const pt of remote.parts||[]){try{await gh(pt.path,{method:'DELETE',body:{message:'صفحات: حذف',sha:pt.sha}});}catch(e){}}
  const cur=await gh(GH_DIR+'/manifest.json');if(cur.ok){const sha=(await cur.json()).sha;await gh(GH_DIR+'/manifest.json',{method:'DELETE',body:{message:'صفحات: حذف',sha}});}}

async function syncProvider(){if(SYNC.prov!==undefined&&SYNC.prov!==null)return SYNC.prov;

function selAction(k,colorVal){

    case 'editx':{const a=m.items[0];openConvert({id:m.id,items:[a],box:bbox(a,r),editA:a,learn:a.type==='math'?INK_SRC.get(a):null,init:a.type==='math'?{type:'math',value:a.tex,rtl:a.rtl}:{type:'text',value:a.text,rtl:true}});break;}

    case 'copytext':if(m.text)copyText(m.text);break;
    case 'hl':case 'ul':case 'st':{const style={hl:'hl',ul:'under',st:'strike'}[k],pr=S.props[style==='hl'?'marker':'tmark'];const a=markupFrom(m.runs||[],style,pr.color,pr.op);if(!a)return;pushUndo();p.annots.push(a);markDirty();clearMsel();break;}

    case 'paste':pasteClip(m.region?m:null);break;
  }
}

function mParse(src){

  const hasPen=items.some(a=>a.type==='pen');
  openConvert({id,items,box:unionBox(items,pageRatio(p)),src,shot:()=>canvasBlob(src),local:hasPen?pref=>localMath(p,items,pref):null});
}
// the "write to text" pen: strokes are converted after a short pause
const HW={id:null,items:[],timer:null};
function hwQueue(id,a){if(HW.id&&HW.id!==id)hwFlush();HW.id=id;HW.items.push(a);clearTimeout(HW.timer);HW.timer=setTimeout(hwFlush,1500);}
async function hwFlush(){
  clearTimeout(HW.timer);const id=HW.id,items=HW.items.slice();HW.items=[];HW.id=null;if(!id||!items.length)return;
  const p=byId(id);if(!p)return;const live=items.filter(a=>p.annots.includes(a));if(!live.length)return;
  const mode=store.get('safahat-hwmode','auto');
  if(mode!=='text'&&(mode==='math'||!AI)){const r=localMath(p,live);
    if(r&&(r.conf>=.6||!AI)){const box=unionBox(live,pageRatio(p)),color=(live.find(a=>a.color)||{}).color||'#111111';
      pushUndo();p.annots=p.annots.filter(a=>!live.includes(a));const out=fitAnnot(p,'math',r.value,r.rtl,box,color);p.annots.push(out);const base=out.tex;if(calcOn())applyCalc(p,out);INK_SRC.set(out,{res:r,sfx:out.tex.slice(base.length)});markDirty();drawOverlay(id);
      toast('تحوّلت إلى معادلة على الجهاز. للتصحيح: حدّدها واضغط «تعديل»'+(r.conf<.6?' — راجعها، فالكتابة غير واضحة تماماً':''),3800);return;}}
  if(!AI){toast(mode==='text'?'تحويل الكتابة إلى نص يحتاج المساعد الذكي. '+aiHelpText():'بقيت الكتابة كما هي. '+aiHelpText(),5500);return;}toast(mode==='math'?'جارٍ تحويل الكتابة إلى معادلة…':'جارٍ تحويل الكتابة…',9000);
  try{const r=await recognizeImg(await canvasBlob(renderInk(p,live)),mode);const still=live.filter(a=>p.annots.includes(a));if(!still.length)return;
    const box=unionBox(still,pageRatio(p)),color=(still.find(a=>a.color)||{}).color||'#111111';
    pushUndo();p.annots=p.annots.filter(a=>!still.includes(a));const out2=fitAnnot(p,r.type,r.value,r.rtl,box,color);p.annots.push(out2);if(calcOn())applyCalc(p,out2);markDirty();drawOverlay(id);
    toast((r.type==='math'?'تحوّلت إلى معادلة':'تحوّلت إلى نص')+'. للتعديل: حدّدها واضغط «تعديل»، وللتراجع زر التراجع',3600);}
  catch(e){toast(e&&e.code==='unreadable'?'لم تُقرأ الكتابة بوضوح، فبقيت كما هي':aiErr(e),3800);}
}
document.addEventListener('keydown',e=>{
  if(!scrim.hidden||/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))return;
  const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(mod&&k==='v'&&CLIP&&inViewer()&&$('#lib').hidden){e.preventDefault();pasteClip(S.msel&&S.msel.region?S.msel:null);return;}
  const m=S.msel;if(!m)return;
  if((e.key==='Delete'||e.key==='Backspace')&&m.items.length){e.preventDefault();selAction('del');}
  else if(mod&&k==='c'){e.preventDefault();selAction(m.items.length?'copy':'copytext');}
  else if(mod&&k==='d'&&m.items.length){e.preventDefault();selAction('dup');}
  else if(e.key==='Escape')clearMsel();
});

/* ---------- wiring ---------- */
function wire(){
  $('#modeBtn').onclick=openModeMenu;$('#moreBtn').onclick=openMoreMenu;$('#shareBtn').onclick=shareSheet;$('#tbar').addEventListener('click',onToolbarClick);
  $('#save').onclick=savePdf;$('#undo').onclick=doUndo;$('#redo').onclick=doRedo;
  $('#undo').oncontextmenu=e=>{e.preventDefault();historySheet();};{let t=0;$('#undo').addEventListener('pointerdown',()=>{t=setTimeout(()=>{t=-1;historySheet();},550);});['pointerup','pointerleave','pointercancel'].forEach(k=>$('#undo').addEventListener(k,()=>{if(t>0)clearTimeout(t);}));}$('#fname').onclick=openRename;
  $('#fileOpen').onchange=e=>{const f=[...e.target.files];e.target.value='';libImport(f);};
  $('#fileAdd').onchange=e=>{const f=[...e.target.files];e.target.value='';openFiles(f,{append:true});};
  $('#fileImgs').onchange=e=>{const f=[...e.target.files];e.target.value='';if(S.pages.length)openFiles(f,{append:true});else openFiles(f);};
  $('#fileImg').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const k=S.pendingKind||'image';S.pendingKind=null;
    try{const u=await readFile(f,'url');let url=u;if(k==='image'){const el=await loadImg(u);const m=1600/Math.max(el.naturalWidth,el.naturalHeight);if(m<1){const c=mkCanvas(el.naturalWidth*m,el.naturalHeight*m);c.getContext('2d').drawImage(el,0,0,c.width,c.height);url=c.toDataURL(/png/.test(f.type)?'image/png':'image/jpeg',.9);}}
      usePendingImage(await addImg(url),k);}catch(err){toast('تعذّر قراءة الصورة');}};
  wireScanner();
  $('#selbar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.sbw||b.dataset.sbz||b.dataset.sbd){const m=S.msel;if(!m)return;const p=byId(m.id);const items=m.items.filter(a=>a.w&&a.type!=='image');if(!items.length)return;pushUndo('السماكة');
      for(const a of items){if(b.dataset.sbw){const v=SIZE_PRESETS.pen[+b.dataset.sbw];a.w=a.type==='marker'?v*4.2:v;}else if(b.dataset.sbz)a.w=Math.max(.0008,Math.min(.08,a.w*+b.dataset.sbz));else if(a.type!=='marker'&&a.type!=='axes'&&a.type!=='numline'){if(b.dataset.sbd==='solid')delete a.dash;else a.dash=b.dataset.sbd;}}
      markDirty();drawOverlay(m.id);m.box=unionBox(m.items,pageRatio(p));drawOverlay(m.id);positionSelbar();return;}
    if(b.dataset.sbr||b.dataset.sbr0){if(b.dataset.sbr0)rotateSel(0,true);else rotateSel(+b.dataset.sbr);renderSelbar('rot');positionSelbar();return;}
    if(b.dataset.sbf!==undefined||b.dataset.sbfc!==undefined){const m=S.msel;if(!m)return;const items=m.items.filter(canFill);if(!items.length)return;pushUndo('التعبئة');
      for(const a of items){if(b.dataset.sbf!==undefined){if(b.dataset.sbf==='none')delete a.fill;else a.fill=b.dataset.sbf;}else{if(b.dataset.sbfc){a.fc=b.dataset.sbfc;if(!a.fill)a.fill='soft';}else delete a.fc;}}
      markDirty();drawOverlay(m.id);renderSelbar('fill');return;}
    if(b.dataset.sbc)selAction(null,b.dataset.sbc);else selAction(b.dataset.sb);});
  $('#selbar').addEventListener('change',e=>{if(e.target.id!=='sbAng')return;const v=+e.target.value;if(!isFinite(v))return;const m=S.msel;if(!m)return;
    const one=m.items.length===1&&ROT_BOX.includes(m.items[0].type);rotateSel(v,one);if(!one)e.target.value='0';positionSelbar();});
  $('#prX').innerHTML=ic('x');$('#prP').innerHTML=ic('prev');$('#prNx').innerHTML=ic('next');
  $('#prX').onclick=closePresent;$('#prP').onclick=()=>prGo(-1);$('#prNx').onclick=()=>prGo(1);
  $('#prC').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();prGo(e.clientX<r.left+r.width/2?1:-1);};
  document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&PR.on&&PR.fs)closePresent();});
  window.addEventListener('resize',()=>{if(PR.on)renderPresent();});
  let dc=0;const drop=$('#drop');
  window.addEventListener('dragenter',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){dc++;drop.hidden=false;}});
  window.addEventListener('dragleave',()=>{dc=Math.max(0,dc-1);if(!dc)drop.hidden=true;});
  window.addEventListener('dragover',e=>e.preventDefault());
  window.addEventListener('drop',e=>{e.preventDefault();dc=0;drop.hidden=true;const f=[...(e.dataTransfer.files||[])];if(f.length&&!$('#scan').hidden){scanAddFiles(f);return;}if(f.length)openFiles(f,{append:S.tab==='pages'});});
  window.addEventListener('beforeunload',e=>{if(S.dirty){e.preventDefault();e.returnValue='';}});
}

async function init(){
  S.mode=store.get('safahat-mode','day');S.layout=store.get('safahat-layout','single')==='spread'?'spread':'single';
  applyTheme(store.get('safahat-theme',null));
  const sp=store.get('safahat-props',null);if(sp)for(const k in DEF_PROPS)S.props[k]={...DEF_PROPS[k],...(sp[k]||{})};
  fontsReady=Promise.race([Promise.all([document.fonts.load(`500 30px "IBM Plex Sans Arabic"`),document.fonts.load(`700 30px "IBM Plex Sans Arabic"`),document.fonts.load(`700 30px "Reem Kufi"`),document.fonts.load(`500 30px "Amiri"`)]),new Promise(r=>setTimeout(r,2500))]).catch(()=>{});
  buildToolbars();renderTools();wire();wireLib();updUndo();setTab('view');
  if(!pdfjs||!window.PDFLib){$('#viewer').innerHTML='<p class="hint" style="padding:24px">تعذّر تحميل مكتبات PDF. تحقق من الاتصال ثم أعد تحميل الصفحة.</p>';return;}
  DB=await idbOpen();if(DB){try{await libLoad();}catch(e){console.warn(e);DB=null;}}
  if(DB){setTimeout(()=>{askPersist();syncCheckOnOpen();},2500);}
  if(DB){$('#backBtn').hidden=false;document.body.classList.add('haslib');
    if(!LB.docs.length&&!store.get('safahat-seeded',false)){try{await makeSample();S.isSample=false;await libAdopt(null);store.set('safahat-seeded',true);}catch(e){console.error(e);}}
    showLibrary('home');}
  else{try{await makeSample();}catch(e){console.error(e);}}
}
window.safahatOpenFiles=async files=>{try{await window.__safahatInit;if(S.dirty&&S.docId)await saveProject();showEditor();await openFiles(files);}catch(e){console.error(e);toast('تعذّر فتح الملف');}};
window.__safahatInit=init();
})();
</script>
