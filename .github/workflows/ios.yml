name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      HAS_SIGNING: ${{ secrets.IOS_CERT_P12_BASE64 != '' && secrets.IOS_PROFILE_BASE64 != '' }}
      HAS_ASC_KEY: ${{ secrets.ASC_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Create iOS project
        run: npx cap add ios

      - name: App icon and splash
        run: npx @capacitor/assets generate --ios --iconBackgroundColor "#0f8a74" --iconBackgroundColorDark "#0f8a74" --splashBackgroundColor "#0f1b1e" --splashBackgroundColorDark "#0f1b1e"

      - name: Permissions, Files app, "Open in"
        run: npm run patch:ios

      - name: Sync (CocoaPods)
        run: npx cap sync ios

      # ---------- 1) Unsigned build: always works, no Apple account needed ----------
      - name: Build unsigned IPA
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/unsigned.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet archive
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/unsigned.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/Safahat-unsigned.ipa" Payload)

      - name: Build for iOS Simulator (opens on a Mac)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/sim" \
            CODE_SIGNING_ALLOWED=NO -quiet build
          (cd "$RUNNER_TEMP/sim/Build/Products/Debug-iphonesimulator" && zip -qry "$GITHUB_WORKSPACE/Safahat-simulator.zip" App.app)

      - name: Upload unsigned builds
        uses: actions/upload-artifact@v4
        with:
          name: safahat-ios-unsigned-${{ github.run_number }}
          path: |
            Safahat-unsigned.ipa
            Safahat-simulator.zip

      # ---------- 2) Signed build for iPhone/iPad + TestFlight (needs Apple Developer secrets) ----------
      - name: Install certificate and profile
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; KCP="$(uuidgen)"
          security create-keychain -p "$KCP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCP" "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCP" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          TEAM=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          if /usr/libexec/PlistBuddy -c 'Print ProvisionedDevices' "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then METHOD=release-testing; else METHOD=app-store-connect; fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          # manual signing for the App target only (the Capacitor pods stay unsigned frameworks)
          export PNAME="$NAME" PTEAM="$TEAM"
          PBX=ios/App/App.xcodeproj/project.pbxproj
          perl -0pi -e 's/^\s*(CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER|"?CODE_SIGN_IDENTITY(\[sdk=iphoneos\*\])?"?) = [^;]*;\n//mg' "$PBX"
          perl -0pi -e 's/(PRODUCT_BUNDLE_IDENTIFIER = [^;]+;)/$1\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = $ENV{PTEAM};\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "$ENV{PNAME}";\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";/g' "$PBX"
          grep -n "PROVISIONING_PROFILE_SPECIFIER" "$PBX"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM" >> "$GITHUB_ENV"
          echo "EXPORT_METHOD=$METHOD" >> "$GITHUB_ENV"

      - name: Build signed IPA
        if: env.HAS_SIGNING == 'true'
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/signed.xcarchive" \
            -quiet archive
          BUNDLE_ID=$(node -p "require('./capacitor.config.json').appId")
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/signed.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          cp "$RUNNER_TEMP"/export/*.ipa "$GITHUB_WORKSPACE/Safahat.ipa"

      - name: Upload signed IPA
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: safahat-ios-signed-${{ github.run_number }}
          path: Safahat.ipa

      - name: Send to TestFlight
        if: env.HAS_SIGNING == 'true' && env.HAS_ASC_KEY == 'true' && env.EXPORT_METHOD == 'app-store-connect'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_P8" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app -f Safahat.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
