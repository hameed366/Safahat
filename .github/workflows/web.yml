name: Web (iPhone home screen)

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Build the web edition
        run: node scripts/build-www.mjs --web

      # The site is served from the main branch: the app lives in app/ (https://<user>.github.io/Safahat/app/)
      - name: Publish into app/ on the main branch
        run: |
          rm -rf app && cp -R www app
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app index.html .nojekyll
          git commit -qm "Web edition update [skip ci]" || echo "nothing new"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
      - name: Ask GitHub Pages to rebuild
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds --jq '.status' || true

      # Same files, for when Pages is switched to "GitHub Actions" in the repository settings
      - name: Site folder
        run: mkdir -p site && cp index.html .nojekyll site/ && cp -R www site/app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
